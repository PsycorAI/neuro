# DPO retest on the SFT'd 363M flagship. STANDARD DPO with reference model.
#
# WHY RE-RUN AT ALL: memory neuro_simpo_collapse_2026_07_26 documents BOTH SimPO
# and standard-DPO collapsing at 500M. That verdict was reached with a SILENTLY
# BROKEN optimizer routing (fixed 2026-08-25: memory neuro_sft_optimizer_drift_fix)
# -- 9 one-row gate matrices were going through Muon's Newton-Schulz, killing β
# on a memory-heavy model. The verdict may have been an artifact of that bug; this
# retest asks the question with correct routing.
#
# DESIGN DECISIONS (each responds to a specific past failure):
#   - STANDARD DPO, not SimPO. Length-norm cheat + no KL anchor was one of the
#     500M failure modes; SimPO stays ruled out at <=500M.
#   - dpo_beta 0.1 (paper default; not touching this axis).
#   - max_tokens 15M -- WELL under 1 epoch of ultrafeedback_binarized (~30M/epoch
#     at max_len 512). Standard-DPO at 500M drifted into repetition at ~1.9 epochs
#     as the same 60k pairs cycled and the model started memorizing preference-set
#     superficial patterns. Keep well under 1 epoch.
#   - gen_check_prompt is the ALPACA-FORMATTED instruction (per today's finding:
#     the default bare prompt is out-of-distribution for an instruct model and
#     creates a false-alarm repetition signal). See neuro_sft_flagship_outcome.
#   - z_loss_weight 1e-4 kept (the flagship's setting; z_loss A/B is separate).
#   - Watchdog on: val_ppl tripwire + [wnorm] telemetry are the new gates from
#     the divergence root-cause work. Cheap and always-on now.
#   - batch_size 4: DPO holds policy + FROZEN reference simultaneously (~2x
#     VRAM vs SFT). SFT ran b=8 at ~22GB; b=4 leaves headroom on 32GB. Reduce
#     to b=3 or grad_accum if it OOMs at real batch.
#
# LAUNCH:
#   CUDA_VISIBLE_DEVICES=0 python src/train_dpo.py --config configs/dpo_flagship_363m.yaml --device cuda
run_name: dpo_flagship_363m
dpo_init: /home/glenn/projects/neuro/models/checkpoints/sft_flagship_363m/step_0003663.pt
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512

# --- STANDARD DPO (not SimPO) ---
simpo_enabled: false
dpo_beta: 0.1

# --- Full-finetune (LoRA retest is a separate question) ---
lora_enabled: false

# --- ARCH: byte-identical to sft_flagship_363m.yaml ---
arch: spiking
vocab: 32768
d: 1280
n_neurons: 3072
d_mem: 1280
n_layers: 9
attention_layer_positions:
- 4
attention_heads: 10
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 4       # DPO: 2 model copies. SFT ran b=8, so b=4.
grad_accum: 4
eval_batch: 4
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Non-DPO aux losses OFF ---
mqar_aug: false
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.15
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs (MUST match base) ---
gdn2_enabled: true
gdn2_chunked: true
gdn2_gate_norm: true
gdn2_chunk_size: 64
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders:
- 2
- 3
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001    # matches flagship; separate A/B tests raising this

# --- Muon+AdamW, gentle DPO LRs (2x lower than SFT, 10x lower than pretrain) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0005
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
muon_precise_gate_filter: true
weight_decay: 0.0
lr: 0.00005
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

# ~915 steps at 4*4*512 = 8192 tok/step. Well under 60k-pair epoch.
max_tokens: 15000000
eval_every: 100
ckpt_every: 200
log_every: 25
keep_last: 6
amp: true
compile: true
seed: 0

# gen-check: ALPACA-FORMATTED (today's fix — bare prompt is OOD for instruct model)
gen_check_every: 100
gen_check_prompt: "### Instruction:\nWhat is the capital of France?\n\n### Response:\n"

# --- divergence guards (2026-08-25) ---
watchdog_enabled: true
watchdog_grace_steps: 150
watchdog_valppl_tol: 0.02
watchdog_valppl_patience: 2
