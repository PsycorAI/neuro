# NorMuon A/B -- TREATMENT arm (NorMuon).
# Byte-identical to screen_normuon_ab_muon_30m.yaml except normuon:true.
# Same seed=0 as control -- identical data order, so a val_ppl gap at
# matched tokens/steps isolates the optimizer variable. Paper reports
# +15% convergence at 350M with ~3% step-time overhead; we're testing
# at 30M to prove the mechanism holds in our codebase before promoting
# it to any flagship run.
run_name: screen_normuon_ab_normuon_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 2
recurrent_bptt_k: 0
recurrent_router_enabled: true
recurrent_router_threshold: 0.5
recurrent_router_aux_weight: 0.1
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 100
ckpt_every: 1000
keep_last: 1
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
