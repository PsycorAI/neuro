# Full-finetune DPO smoke -- companion to dpo_30m_lora_v2_smoke.yaml. Tiny
# (5M tok) end-to-end validation of the non-LoRA DPO path. Symmetric coverage:
# full-FT SFT -> full-FT DPO. Base: sft_30m_full_v2 final ckpt (100M tok SFT
# on the current-recipe base, val loss ~2.7).
run_name: dpo_30m_full_v2_smoke
dpo_init: /home/glenn/projects/neuro/models/checkpoints/sft_30m_full_v2/step_0006104.pt
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512
dpo_beta: 0.1

# --- Full-finetune (no LoRA) ---
lora_enabled: false

# --- ARCH: byte-identical to sft_30m_full_v2 (matches the base) ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
# DPO doubles VRAM (policy + frozen reference); halve batch_size vs SFT
batch_size: 8
grad_accum: 2
eval_batch: 4
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Pretraining-only knobs: OFF during DPO ---
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs (MUST match base) ---
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Muon+AdamW, gentle DPO LRs (~2x lower than SFT per Rafailov guidance) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0005
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.00005
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

# --- Smoke budget: 5M tok, same as LoRA-DPO smoke for direct comparison ---
max_tokens: 5000000
ckpt_every: 500
keep_last: 2
log_every: 50
amp: true
compile: true
seed: 0
