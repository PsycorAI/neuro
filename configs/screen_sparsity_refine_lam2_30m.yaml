# Sparsity-refinement screen -- treatment #1 (λ = 2.0, 2x base pretrain λ).
#
# GOAL: design the post-pretrain sparsity refinement for 500M v3 (currently at
# spike ~0.30-0.32, needs to move toward ~0.05-0.08 for the low-energy pillar
# of the demo). Question: how much does spike move per unit of λ during
# refine, and what val_ppl cost do we pay?
#
# APPROACH: refine the existing 30M base (screen_compile_blk640_30m,
# step_0004883.pt, 100M tok, spike 0.180, val_ppl 71.48) for +50M tok at
# elevated λ. Same recipe as base except sparsity_lambda scaled up, MQAR-aug
# off (preserve prior recall), curriculum off (already done in base).
#
# Paired with screen_sparsity_refine_lam5_30m.yaml (λ=5.0) for elasticity
# measurement -- two datapoints show the response curve, informing 500M refine
# λ choice (see HANDOFF_2026_07_20.md, parallel-option next-action).
#
# Copy the base ckpt in before launching:
#   mkdir -p models/checkpoints/screen_sparsity_refine_lam2_30m
#   cp models/checkpoints/screen_compile_blk640_30m/step_0004883.pt \
#      models/checkpoints/screen_sparsity_refine_lam2_30m/
#
# Success criteria:
#   - spike drops measurably (>0.03) from base's 0.180
#   - val_ppl regression < 3.0 ppl (some regression IS expected)
#   - β dead_frac stays 0% on all blocks (delta path intact)
#   - memory-Δ within ~15% of base (don't undo recall)
run_name: screen_sparsity_refine_lam2_30m

# --- ARCH: byte-identical to base ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- MQAR-AUG OFF: preserve base recall, don't retrain the auxiliary head ---
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0

# --- Sparsity: 2x base pretrain λ. Target unchanged. ---
sparsity_lambda: 2.0
sparsity_target: 0.05

# --- Full recipe from base (unchanged) ---
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64

# --- Curriculum OFF: base already burned its 10% at start of pretrain ---
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Optimizer: unchanged NorMuon, LR halved (base used 0.005/0.0006) ---
# Rationale: refining an already-recall-optimized model; big steps risk
# overshooting the sparsity target and damaging quality/memory. Matches the
# 0.5x pattern from the archived sparsity_refine_500m.yaml.
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0025
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0003

# --- LR SCHEDULE: constant during refine (no decay, no warmup). ---
lr_min_frac: 1.0
lr_warmup_frac: 0.0

lam: 0.98

# +50M tokens on top of base's 100M => 150M total.
max_tokens: 150000000

# --- Tight tracking: eval every 200 steps (~4M tok) to see spike trajectory ---
eval_every: 200
ckpt_every: 5000
keep_last: 2
log_every: 100
amp: true
compile: true
compile_mode: default
compile_dynamic: false
seed: 0
