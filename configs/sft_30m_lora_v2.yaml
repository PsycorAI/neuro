# LoRA SFT on the current-recipe 30M base -- rebased 2026-07-20.
#
# The prior sft_30m_lora.yaml pointed at screen_engram_v2_ab_control_30m,
# whose ckpt was deleted in the 2026-07-15 45GB models/brains/ cleanup. This
# config rebases to screen_compile_blk640_30m (the current-recipe 30M twin
# of 500M v3: gdn2_chunked + normuon + engram_v2 + mtp + rmsnorm + z_loss +
# embed_scale + curriculum + mqar_aug + beta_floor + batch_a, 100M tok).
#
# LoRA adapts only the delta-rule Q/K/V projections; base weights frozen.
# Produces a full ckpt for resume AND a tiny adapter_step_*.pt (swappable
# skill mod). Bake with scripts/merge_lora_ckpt.py.
#
# Copy the base ckpt in before launching:
#   mkdir -p models/checkpoints/sft_30m_lora_v2
#   cp models/checkpoints/screen_compile_blk640_30m/step_0004883.pt \
#      models/checkpoints/sft_30m_lora_v2/
# (train_sft.py loads the base via sft_init, but also needs its own run dir
# for its own checkpoints -- pre-seeding avoids a first-run edge case.)
run_name: sft_30m_lora_v2
sft_init: screen_compile_blk640_30m
sft_dataset: yahma/alpaca-cleaned
sft_split: train
sft_max_len: 512

# --- LoRA (unchanged from prior config) ---
lora_enabled: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [W_q, W_k, W_v]

# --- ARCH: byte-identical to screen_compile_blk640_30m ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Pretraining-only knobs: OFF during SFT ---
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs from base: MUST match (part of the shape) ---
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Muon fields (harmless when lora_enabled; forces AdamW-over-adapters) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true

# --- LoRA-appropriate LR: higher than full-finetune SFT (small adapter params) ---
lr: 0.0003
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

max_tokens: 100000000
eval_every: 2000
ckpt_every: 2000
keep_last: 2
log_every: 100
amp: true

# --- compile: true is a STRUCTURAL flag here, NOT a JIT switch. train_sft.py
#    never calls torch.compile (grep: no torch.compile in the file); it only
#    reads `compile` to set compile_safe, which controls whether the snntorch
#    Leaky `self.lif` submodule is created (model.py:345). The base ckpt
#    (screen_compile_blk640_30m) was made with compile:true => compile_safe=True
#    => NO self.lif => 8 fewer buffer keys. Matching it here gives a clean 0/0
#    state_dict load. With use_fpt:true the forward uses lif_parallel(beta_val)
#    not self.lif, so this has zero effect on the SFT forward/generation math.
#    (The prior sft_30m_lora.yaml used compile:false only because ITS base,
#    screen_engram_v2_ab_control_30m, was itself a non-compiled run.)
compile: true
seed: 0
