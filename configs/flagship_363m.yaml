# 363M flagship pretrain. Generated by temp/gen_flagship_363m.py -- edit that.
# Recipe = the P4 composed arm (gate-norm + Muon wd + lambda 0.5 + grad_accum 4),
# 2-seed confirmed 2026-08-08 at B=256: 100/99/96/85/50 vs 100/100/98/82/52,
# PLUS the X1-winning muon_precise_gate_filter (2026-08-09), PLUS
# compile_mode: max-autotune-no-cudagraphs (keeps inductor kernel autotuning --
# most of the +30% probe gain -- while dropping the CUDAGraphs replay layer
# that collides with the separately-compiled MQAR path). gdn2_chunk_size stays 64 --
# 256 is disqualified, it breaks recall_eval at real batch sizes. Rationale
# for every delta vs P4 is in the generator docstring and in
# docs/pre_flagship_audit_2026_08_08.md / memory
# neuro_pre_flagship_audit_2026_08_08.
#
# DO NOT wrap this in a wall-clock `timeout` that would cut it short: max_tokens
# is the real budget so the cosine LR schedule finishes. If you must bound it,
# bound it generously (>= 11 days) and let it exit naturally.
run_name: flagship_363m
data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin
arch: spiking
vocab: 32768
d: 1280
n_neurons: 3072
d_mem: 1280
n_layers: 9
