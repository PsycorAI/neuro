# screen_scale_base_d1024_6L (2026-09-10 scale re-check). Tests the 30M width->recall win at LARGER
# scale but with d_mem=1024 HELD (adequate state) -- removes the confound in
# tonight's d=640 90M run. d=1024, 6 layers (~90-97M), 150M tok. Pair: base
# (n_neurons 1024) vs wide (n_neurons 2560, 2.5x). If wide still lifts recall,
# the 30M width win scales when state is adequate.
# screen_v3levers_ctrl_s0_30m -- v3-lever screen (2026-09-09). 30M, seed 0.
# SHARED CONTROL: current recipe, muon_lr=0.005, uniform MQAR. Baseline for both levers.
# Base recipe = current 30M (screen_headwd_base_s0_30m body), head_wd OFF,
# [4,32]+w0.5. ONE variable vs screen_v3levers_ctrl_s0_30m.
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 6
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 24
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
gdn2_chunked: true
gdn2_chunk_size: 64
gdn2_loglinear: false         # ONE-variable delta vs control
gdn2_loglinear_L: 5          # 2^5 = 32 >= n_chunks=8 at block_size=512
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 150000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
run_name: screen_scale_base_d1024_6L
seed: 0
watchdog_enabled: false
weight_decay: 0.1
