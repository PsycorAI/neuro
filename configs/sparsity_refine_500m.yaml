# Refinement #2: crush spike rate ~0.13 -> ~0.08 without losing knowledge.
# Continues from MQAR-refined ckpt (MODEL-ONLY seed) with 3x higher sparsity
# penalty and LR x0.5.
run_name: sparsity_refine_500m

data_bin: /home/glenn/projects/bdh/data/tokenized_phi/train.bin
data_orig_vocab: 32064
vocab: 32064

arch: spiking
d: 2048
n_neurons: 4352
d_mem: 2048
n_layers: 5
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200

block_size: 512
batch_size: 6
grad_accum: 5
eval_batch: 4

use_fpt: true
fpt_K: 10
delta_rule: true
decay_gate: true

mqar_aug: false        # keep MQAR-refine gains, don't retrain it
mqar_weight: 0.5

sparsity_lambda: 3.0   # 3x stronger than Phase 1
sparsity_target: 0.05

optimizer: muon
muon_lr: 0.0025        # 0.5x — gentler
lr: 0.0002             # 0.5x
lr_min_frac: 1.0
lam: 0.98

kd_enabled: false

max_tokens: 2150000000  # +50M tokens on top of MQAR-refined 2.05B
eval_every: 500
ckpt_every: 500
keep_last: 2
log_every: 200
amp: true
compile: false
seed: 0
