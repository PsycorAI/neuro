# B-sweep: ORPO safety probe. Does a reference-free preference method that KEEPS
# an explicit SFT-NLL term survive where DPO/SimPO word-souped this memory-heavy
# pipeline (neuro_dpo_retest_2026_08_26_null)?
#
# Init from the EXISTING SFT artifact (sft_flagship_363m/step_0003663) and run on
# the SAME UltraFeedback pairs DPO collapsed on -> apples-to-apples.
# PRE-REGISTERED WIN: (a) gen-check stays coherent through training (DPO went to
# word-soup by ~step 100), AND (b) post-hoc recall_eval --replay split + memory-Delta
# hold vs the SFT base. If ORPO ALSO collapses, preference-opt is closed for this arch.
#
# Base = OLD flagship SFT (vocab 32768, arch-faithful to v3). 5080 ONLY.
#   CUDA_VISIBLE_DEVICES=1 python src/train_dpo.py --config configs/orpo_probe_363m.yaml --device cuda
run_name: orpo_probe_363m

# --- ORPO objective (reference-free; new in train_dpo.py) ---
objective: orpo
orpo_lambda: 0.1                    # Hong 2024 default; weak odds-ratio penalty

dpo_init: sft_flagship_363m         # run_name -> latest ckpt (step_0003663)
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512

# Early-collapse detector: DPO word-souped by ~step 100. Check often.
gen_check_every: 100
gen_check_prompt: "### Instruction:\nWhat is the capital of France?\n\n### Response:\n"

lora_enabled: false

# --- ARCH: byte-identical to sft_flagship_363m.yaml ---
arch: spiking
vocab: 32768
d: 1280
n_neurons: 3072
d_mem: 1280
n_layers: 9
attention_layer_positions:
- 4
attention_heads: 10
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 4                       # doubles to 8 seqs (chosen+rejected), eager
grad_accum: 4
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: false
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.15
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
gdn2_enabled: true
gdn2_chunked: true
gdn2_gate_norm: true
gdn2_chunk_size: 64
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders:
- 2
- 3
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.001
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
muon_precise_gate_filter: true
weight_decay: 0.0
lr: 0.0001
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98
max_tokens: 30000000               # ~1831 steps; DPO collapsed by ~50 steps
ckpt_every: 500
log_every: 25
keep_last: 6
amp: true
compile: true
seed: 0
