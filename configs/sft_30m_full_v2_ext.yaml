# Full-FT SFT budget extension -- companion to sft_30m_lora_v2_ext.yaml.
# Bootstraps from sft_30m_full_v2's 100M-tok ckpt (loss 2.68) and trains
# 200M more to 300M total. Symmetric to the LoRA extended run so we can
# compare "does more budget help full-FT" vs "does more budget help LoRA"
# (LoRA extended showed no improvement).
#
# Bootstrap: copy sft_30m_full_v2/step_0006104.pt into this run's ckpt dir
# so train_sft.py's auto-resume picks it up.
run_name: sft_30m_full_v2_ext
sft_init: screen_compile_blk640_30m
sft_dataset: yahma/alpaca-cleaned
sft_split: train
sft_max_len: 512

lora_enabled: false

# --- ARCH: byte-identical to sft_30m_full_v2 ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.001
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0001
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

max_tokens: 300000000
eval_every: 2000
ckpt_every: 2000
keep_last: 2
log_every: 100
amp: true
compile: true
seed: 0
