# Full-FT DPO extended -- 10x the smoke's budget (5M -> 50M tok). Tests
# whether the noisy DPO signal at 5M was just too-few-tokens (expected)
# or a real problem. Starts fresh from the sft_30m_full_v2 base (not
# resuming from the smoke ckpt, to avoid smoke-optimizer-state edge cases).
run_name: dpo_30m_full_v2_ext
dpo_init: /home/glenn/projects/neuro/models/checkpoints/sft_30m_full_v2/step_0006104.pt
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512
dpo_beta: 0.1

lora_enabled: false

# --- ARCH: byte-identical to sft_30m_full_v2 (matches base) ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
# DPO doubles VRAM; halve batch_size vs SFT
batch_size: 8
grad_accum: 2
eval_batch: 4
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0005
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.00005
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

# 10x smoke budget
max_tokens: 50000000
ckpt_every: 1000
keep_last: 2
log_every: 100
amp: true
compile: true
seed: 0
