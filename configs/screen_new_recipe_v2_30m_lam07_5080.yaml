# 30M new-recipe screen v2 (2026-08-01) — SPARSITY LAMBDA=0.7 sweep arm.
#
# Byte-identical to screen_new_recipe_v2_30m_ctrl.yaml (the no-KD control)
# except sparsity_lambda 0.3 -> 0.7. Sibling of screen_new_recipe_v2_30m_lam05
# (lambda=0.5) -- see that file's header for the full rationale. This is
# the more aggressive arm of the sweep.
#
# Runs on the 5080 (batch_size 32->16 / grad_accum 1->2 for that card's
# smaller VRAM, effective batch held at 32) while the 5090 runs the clean
# seed1 reconfirm. CAVEAT: since lam05 ran on the 5090 at batch=32/
# grad_accum=1, this lambda=0.7 vs lam05 comparison carries the SAME kind
# of GPU/batch confound flagged for the seed1 re-run -- treat the 3-point
# elasticity curve (lam03/lam05/lam07) as directional, not definitive,
# until/unless a same-GPU confirm is run.
run_name: screen_new_recipe_v2_30m_lam07_5080

# Points at the raw Llama-3-tokenized corpus (not the fresh-BPE bin).
# StreamText auto-builds vocab_map_32768.npy on first launch.
data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin

arch: spiking
vocab: 32768
d: 384
n_neurons: 384
d_mem: 384
n_layers: 4
attention_layer_positions: [2]
attention_heads: 8
attention_max_seq_len: 4096
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.7
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 30000000
eval_every: 500
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
seed: 0

# KD: OFF (this is the control)
kd_enabled: false
