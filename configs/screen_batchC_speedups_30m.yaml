# Batch C + Tier 1 speedups (8-bit AdamW + fused CE). Same arch/features as
# screen_batchC_30m, only adding the two speedup flags. Measure tok/s + VRAM
# delta against screen_batchC_30m (val_ppl 59.80 baseline).
run_name: screen_batchC_speedups_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05

# MTP + Batch A + Batch C
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
markov_enabled: true
markov_rank: 64
confidence_enabled: true
confidence_weight: 0.05

# Tier 1 speedups
adamw_8bit: true
fused_ce: true

optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 1000
keep_last: 1
log_every: 200
amp: true
compile: false
seed: 0
