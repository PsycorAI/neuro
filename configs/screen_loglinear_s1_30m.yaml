# Log-linear Stage-B -- TREATMENT, seed 1.
# Generated from configs/screen_loglinear_30m.yaml (treatment seed 0, DONE)
# by temp/gen_stageB_configs.py; body IDENTICAL except seed:1 (+ run_name).
# Second training seed for the 2-seed A/B vs the matched controls
# screen_loglinear_ctrl_30m.yaml / screen_loglinear_ctrl_s1_30m.yaml.
run_name: screen_loglinear_s1_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
gdn2_chunked: true
gdn2_chunk_size: 64
gdn2_loglinear: true         # ONE-variable delta vs control
gdn2_loglinear_L: 5          # 2^5 = 32 >= n_chunks=8 at block_size=512
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 1
