# MoR variation: ponder_aux_weight 0.1 -> 0.3 (3x stronger router calibration).
# Tests whether better-calibrated router scores make the causal EVAL keep_rate
# track the training capacity schedule [0.667, 0.333] more tightly. Unlike the
# old PonderNet cost weight, this has NO collapse risk (compute budget is fixed
# by hard top-k, not by this loss) -- so there's no knife-edge to fear by going
# higher. If higher aux_weight tightens eval keep_rate toward capacity without
# hurting val_ppl, that's a straightforward win: better transfer of the
# mechanism from train-time (top-k) to the causal inference path (threshold).
run_name: screen_mor_aux03_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
ponder_enabled: true
ponder_steps: 3
ponder_aux_weight: 0.3
ponder_threshold: 0.5
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
