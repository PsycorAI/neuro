# MoR (Mixture-of-Recursions / adaptive computation) test at 200M params,
# 2B tokens -- crosses the paper's own ~135M underperform-vanilla threshold
# with a real token budget, before ever committing 500M compute to MoR.
#
# Everything except recurrent_depth/router is the CONFIRMED final recipe:
# NorMuon + Engram-v2 + F1 (muon_fix_gate_matrices) + F2
# (muon_route_embeddings_by_type) + GDN-2 + curriculum warmup + beta_floor +
# mqar_aug -- same pieces as screen_bake_500m_derisk_gdn2_90m.yaml, scaled up.
# If GDN-2's 90M de-risk instead points to SDM, swap gdn2_enabled/sdm_enabled
# here to match before launching.
#
# Architecture: ~215M params (d/n_neurons/d_mem/n_layers from the old
# phase3_200M reference, configs/archive/phase3_200M.yaml), block_size bumped
# 128->512 and vocab kept at 16384 (Llama-3 data) to match the current
# screening pipeline instead of that older config's conventions.
#
# recurrent_depth=2 + router = MoR itself. threshold/aux_weight carried over
# from the last MoR screen at 90M (screen_rdepth2_mor_90m_seed1_beta_floor.yaml,
# now archived) as a starting point -- may need re-tuning at this scale.
#
# batch_size/grad_accum are a conservative starting guess for the 5090 at
# this scale (not yet empirically tuned) -- check nvidia-smi after launch and
# raise batch_size if there's headroom (see 5080-throughput-priority
# precedent: size for GPU util without hurting quality).
run_name: screen_mor_200m_2b
arch: spiking
vocab: 16384
d: 1536
n_neurons: 3072
d_mem: 1536
n_layers: 5
recurrent: false
recurrent_depth: 2
recurrent_bptt_k: 0
recurrent_router_enabled: true
recurrent_router_threshold: 0.5
recurrent_router_aux_weight: 0.1
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
gdn2_chunked: true  # dense chunked-WY fast path; fla kernel rejected 2026-07-15 (recall collapse H>=8)
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: true
curriculum_frac: 0.1
curriculum_block_tokens: 4096
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0005
lam: 0.98
max_tokens: 2000000000
eval_every: 1000
ckpt_every: 1000
keep_last: 3
log_every: 200
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
