# Post-SimPO sparsity cleanup PASS 2 (STAGED, NOT AUTO-LAUNCHED).
#
# Only run manually AFTER Pass 1 (sparsity_cleanup_500m_v3) completes and
# has been evaluated. This is the aggressive-fallback follow-up if Pass 1
# gets spike into the 0.15 range but not down to the 0.05-0.10 target.
#
# λ=10.0 (10x pretrain λ=1.0, matching the 30M screen's λ=5.0/0.5=10x ratio
# that hit 59% compression at 30M). From Pass 1's expected ~0.15, another
# ~30-40% compression -> 0.09-0.11 landing. Val_ppl regression will be
# noticeable (~3-5 ppl beyond Pass 1); expected tradeoff for lower spike.
#
# Manual launch:
#   mkdir -p models/checkpoints/sparsity_cleanup2_500m_v3
#   cp models/checkpoints/sparsity_cleanup_500m_v3/step_$(ls models/checkpoints/sparsity_cleanup_500m_v3 | grep step_ | sort | tail -1 | grep -oE 'step_[0-9]+' | grep -oE '[0-9]+').pt \\
#      models/checkpoints/sparsity_cleanup2_500m_v3/
#   CUDA_VISIBLE_DEVICES=0 ~/projects/bdh/venv/bin/python -u \\
#     src/train_5090_gpu.py --config configs/sparsity_cleanup2_500m_v3.yaml --device cuda \\
#     >> logs/chain_500m_postpretrain.txt 2>&1 &
run_name: sparsity_cleanup2_500m_v3

arch: spiking
vocab: 16384
d: 2048
n_neurons: 4864
d_mem: 2048
n_layers: 5
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 14
grad_accum: 2
eval_batch: 4
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

mqar_aug: false
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.0

# --- Sparsity: 10x pretrain λ (aggressive; matches 30M screen's max tested) ---
sparsity_lambda: 10.0
sparsity_target: 0.05

gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0025
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0002
lr_min_frac: 1.0
lr_warmup_frac: 0.0
lam: 0.98

# +100M tokens on top of Pass 1's endpoint.
# 2026-07-28: DPO stopped early at step 8000 (~115M tok), Pass 1 adjusted
# to add 150M -> ~265M endpoint, Pass 2 adds 100M -> 365M target.
max_tokens: 365000000

eval_every: 200
ckpt_every: 2000
keep_last: 3
log_every: 100
snapshot_brain: false
amp: true
compile: true
compile_mode: default
compile_dynamic: false
seed: 0
