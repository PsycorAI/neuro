# 350M MoR adaptive recurrent-depth screen. Architecture copied from
# phase3_350M_kd.yaml (the flagship 350M base arch, pre-KD); all other
# settings (router, delta_rule/decay_gate/mqar recipe, optimizer, throughput
# knobs) copied from the most recent MoR config, screen_rdepth2_mor_200mtok_seed1_30m.yaml.
# Comparison point per Glenn: models/checkpoints/phase3_350M_kd (val_ppl ~55
# after 7.5B tok CE+KD) -- NOT a matched-recipe fair baseline (that config has
# no delta_rule/decay_gate/mqar/recurrent_depth and a different token count),
# just an existing reference point, not a rigorous depth-1 control.
# Token budget: 2B (per HANDOFF research into arXiv:2507.10524's IsoFLOP
# curve -- ~0.9B tok is MoR's low-budget crossover at this scale, ~2.3B is
# the mid-budget point with a clearer margin).
run_name: screen_rdepth2_mor_350m
arch: spiking
# --- architecture (from phase3_350M_kd) ---
vocab: 16384
d: 2048
n_neurons: 4096
d_mem: 2048
n_layers: 5
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200
block_size: 1280
# --- MoR / recipe details (from screen_rdepth2_mor_200mtok_seed1_30m) ---
recurrent_depth: 2
recurrent_bptt_k: 0
recurrent_router_enabled: true
recurrent_router_threshold: 0.5
recurrent_router_aux_weight: 0.1
eval_batch: 4
use_fpt: true
fpt_K: 10
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98


# > 6 x 5 x 1280 block, ~ tok/s,  VRAM usage

# 4 x 8 x 1536 block, ~2950 tok/s, 15.3 VRAM usage
# 4 x 8 x 1664 block, ~ tok/s,  VRAM usage
# 4 x 8 x 1408 block, 14.9 GB VRAM usage - skipped
# 4 x 8 x 1280 block produced 2930 tok/s with 14.6GB VRAM usage
# 4 x 8 x 1024 block produced 2750 tok/s with 13.5 VRAM usage
# 4 x 8 x 896 block size produced 2400 tok/s with 13.3 VRAM usage
# 4 x 8 x 768 block size produced 2100 tok/s with 12.7 VRAM usage
# 8 x 4 produced  300 tok/s with 22GB spillage
# 10 x 3 produced ???3500 tok/s with 3.8GB spillage
# 10 x 3 On the 2nd try, never finished a step due to spillage from the 5090 
# 16 x 2 produced  200 tok/s with 3.5GB spillage
# 32 x 1 ?
batch_size: 6
grad_accum: 5
max_tokens: 2000000000
eval_every: 2000
ckpt_every: 500
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
use_fla_kernel: true
fused_ce: true
seed: 0
