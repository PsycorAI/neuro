# 1B v1 -- DRAFT (2026-07-29). Do not launch yet; three pre-launch gates open.
# See docs/1b_v1_design.md for full rationale.
#
# Scale test of the settled 500M v3 recipe. Same tokenizer, same data source,
# same GDN-2 chunked + Engram-v2 + NorMuon + curriculum + MQAR-aug + MTP +
# sparsity + torch.compile stack. Shape target: ~1.0B params via depth
# (5L -> 8L) and modest width bump (d 2048 -> 2560, n_neurons 4864 -> 6144,
# d_mem 2048 -> 2560).
#
# batch_size / grad_accum values below are PLACEHOLDERS -- must be replaced
# by a live VRAM probe on the true 1B shape before launch (500m_v3.yaml:71
# lesson: the synthetic probe estimate underestimated live VRAM by ~1.6 GiB
# and dropped GPU util 97% -> 70% until batch was dropped 16 -> 15).
run_name: 1b_v1
arch: spiking
vocab: 16384
d: 2560
n_neurons: 6144
d_mem: 2560
n_layers: 8
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 8      # PROBE FIRST -- placeholder
grad_accum: 4      # PROBE FIRST -- placeholder
eval_batch: 4
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 1.0
sparsity_target: 0.05
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: true
curriculum_frac: 0.1
curriculum_block_tokens: 4096
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
lr: 0.0004
lam: 0.98
max_tokens: 10000000000   # 10B tokens = 10 tok/param at ~1B params (undertrained per Chinchilla; matches 500M v3's own ratio)
eval_every: 1000
ckpt_every: 1000
keep_last: 4
log_every: 100
snapshot_brain: false
amp: true
compile: true
compile_mode: default
compile_dynamic: false
seed: 0
