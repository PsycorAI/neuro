# Engram-v2 heads A/B: heads=6 mid-point arm. Byte-identical to the current-recipe
# 30M config (screen_bake_full_gdn2_batchA_30m.yaml -- Batch A folded in,
# gdn2_chunked, beta_floor, mqar_aug, NorMuon+F1+F2, curriculum) EXCEPT
# run_name. Pair with screen_engram_v2_h8_30m.yaml. Primary metric is
# factual ablation-Delta via scripts/engram_factual_eval.py (val_ppl barely
# moves with hash memory per DeepSeek's own ablation and the module's own
# docstring). Single-seed screen is defensible here because heads is pure
# collision-redundancy, not a mechanism change (unlike MoE/Engram-v1/rdepth,
# which needed seed replication after single-seed reversals).
# 500M-decision piece #1b: full recipe (NorMuon+Engram-v2+F1+F2+GDN-2+
# curriculum+beta_floor+mqar_aug, same as screen_bake_full_gdn2_30m's
# confirmed 72.26) PLUS Batch A (RMSNorm+z_loss+deeper MTP+embed_scale w/
# paired init) -- the biggest single 30M win in project history (-32.6%
# val_ppl vs baseline, neuro_batch_a_findings.md) but never screened
# together with this cycle's recipe. Composition unknown; testing before
# the 500M restart commits either way.
run_name: screen_engram_v2_h6_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 6
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: true
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 1000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
