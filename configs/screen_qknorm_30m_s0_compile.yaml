# PHASE 0 GATE — compile parity check (2026-08-02).
#
# Byte-identical to screen_qknorm_30m_s0.yaml EXCEPT compile: true (+ new
# run_name so it can't resume that run's checkpoint). Compares against that
# run's known EAGER result: val_ppl 140.30, spike 0.223.
#
# Why this gate exists: torch.compile has been validated on the PRE-attention
# architecture only. It has never been run with HybridAttentionBlock + QK-norm,
# and this project has a real silent-miscompile history — lif_parallel's
# data-dependent FPT loop was miscompiled into a spike collapse (0.185->0.11)
# and ~2x worse val_ppl before being caught (reference_torch_compile_delta).
# The entire Step 3 time budget (~2 days instead of ~5) rests on compile being
# quality-neutral here, so it gets verified before Phases 1-2, not assumed.
#
# GATE: val_ppl within ~2% of 140.30 AND spike rate within noise -> proceed.
# Otherwise drop compile and re-budget Phases 1-2 at ~2.3x wall clock.
run_name: screen_qknorm_30m_s0_compile

data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin

arch: spiking
vocab: 32768
d: 384
n_neurons: 384
d_mem: 384
n_layers: 4
attention_layer_positions: [2]
attention_heads: 8
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.3
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 30000000
eval_every: 500
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: true
compile_mode: default   # NOT reduce-overhead (CUDA Graph crash under grad_accum
                        # + GDN-2 checkpoint recompute — see 500m_v3.yaml:136)
compile_dynamic: false
seed: 0

kd_enabled: false
