# 30M screen for the model_quality_redesign recipe (2026-07-31).
#
# Combines P2 (hybrid attention), P3 (proper 32k tokenizer, zero-drops),
# and P5 (relaxed spike target 5% -> 15%) — all three of the fixable
# root causes identified in docs/model_quality_redesign.md.
#
# All PROVEN wins from the 500M v3 recipe are KEPT unchanged:
#   GDN-2 chunked, Engram-v2, NorMuon, MTP, curriculum, MQAR-aug,
#   beta_floor, Muon F1/F2 fixes, RMSNorm+embed_scale+z_loss, torch.compile.
#
# CHANGES vs screen_bake_full_gdn2_batchA_30m.yaml (the closest recipe control):
#   vocab              : 16384 -> 32768        (new BPE tokenizer, zero drops)
#   data_bin           : train.bin -> train_32k.bin   (already-32k-tokenized)
#   d/n_neurons/d_mem  : 1024 -> 384           (need to shrink for the larger vocab)
#   n_layers           : 2 -> 4                (need >=3 layers to place attention meaningfully)
#   attention_layer_positions: null -> [2]     (1 full-attn layer, middle)
#   attention_heads    : (new) 8
#   sparsity_target    : 0.05 -> 0.15          (relaxed; SpikingBrain rationale)
#   sparsity_lambda    : 0.5 -> 0.3            (reduce headwind pressure)
#   mqar_N_max         : 32 -> 16              (fixed N stops dynamo recompile churn)
#
# Success bar (pre-registered):
#   Qualitative coherence on a few short prompts CLEARLY beats the old recipe
#   30M control (temp/demo_out_sft.txt reference). Not looking for magic at
#   30M — looking for the CHARACTER of the output to be more sensible
#   (fewer "The complex and multifaceted of the..." loops).
#
# val_ppl is NOT comparable across vocabs (different token distributions).
# For inter-recipe comparison at this stage, judge qualitative sample output
# only. Establish new-vocab val_ppl trajectory here as the reference for
# future new-recipe screens.
run_name: screen_new_recipe_v1_30m

# NEW: point loader at the 32k-vocab retokenized corpus. Loader
# (src/data_stream.py StreamText) auto-resolves the LUT path to
# data/vocab_map_{vocab}.npy — our retokenize_32k.py wrote the identity
# LUT there (values 0..32767) so the loader's `lut[raw_block]` step is a
# no-op remap, letting the code work unchanged.
data_bin: /home/glenn/projects/neuro/data/tok_32k/train_32k.bin

arch: spiking
vocab: 32768
d: 384
n_neurons: 384
d_mem: 384
n_layers: 4
attention_layer_positions: [2]   # NEW — full-softmax + RoPE + SwiGLU at layer 2
attention_heads: 8
attention_max_seq_len: 4096
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.3               # relaxed vs old 0.5 (see P5)
sparsity_target: 0.15              # relaxed 0.05 -> 0.15 (see P5)
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false          # curriculum_order_4096.npy is 16k-vocab specific; skip for this screen
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 30000000
eval_every: 500
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false                     # skip compile at 30M (compile trace time > run time)
seed: 0
