# LoRA SFT budget extension -- 100M tok already trained in sft_30m_lora_v2,
# this run resumes from that ckpt and trains 200M more (to 300M total). Tests
# whether LoRA's ~1.5 loss gap vs full-FT closes with more budget, or is a
# capacity ceiling (the r=16/32 companion runs test the capacity axis).
#
# New run dir so the sft_30m_lora_v2 100M-tok ckpts + adapter + merged.pt
# stay preserved (the LoRA-DPO smoke's dpo_init merged.pt was made from that
# snapshot; overwriting would decouple them).
#
# LR schedule NOTE: total_steps recomputes on max_tokens=300M -> 18310 steps
# (was 6103). Cosine anneal is now 3x longer, so the LR at resume-point
# 6104 will be at ~1 - cos(pi * 6104/18310) ~ 55% of the way through, still
# well above lr_min_frac. This is a schedule discontinuity but a helpful one
# (LoRA at end of v2 was near lr_min; a higher LR here allows further learning).
# The A/B interpretation stays clean: 100M-tok result was v2's endpoint; this
# run says "does 300M-tok total move it further".
#
# Bootstrap: copy step_0006104.pt + adapter_step_0006104.pt from sft_30m_lora_v2
# into this run's ckpt dir so it resumes from that state.
run_name: sft_30m_lora_v2_ext
sft_init: screen_compile_blk640_30m
sft_dataset: yahma/alpaca-cleaned
sft_split: train
sft_max_len: 512

lora_enabled: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [W_q, W_k, W_v]

arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0025
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true

lr: 0.0003
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

# 300M total = 100M already done in sft_30m_lora_v2 + 200M more here
max_tokens: 300000000
eval_every: 2000
ckpt_every: 2000
keep_last: 2
log_every: 100
amp: true
compile: true
seed: 0
