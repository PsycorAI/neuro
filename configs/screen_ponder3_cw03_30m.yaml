# Adaptive-computation re-screen: same as screen_ponder3_30m but
# ponder_cost_weight 0.01 -> 0.3 (30x). Paired with screen_ponder3_cw01_30m
# (10x) to bracket the fix -- if 0.1 still saturates at max steps, 0.3 tests
# whether a stronger push unlocks real per-token adaptivity or whether the
# plain mean-steps penalty needs replacing with PonderNet's proper
# KL-to-geometric-prior regularizer instead.
run_name: screen_ponder3_cw03_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
ponder_enabled: true
ponder_steps: 3
ponder_cost_weight: 0.3
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
