# Standard DPO on the 500M v3 SFT'd model -- reverting to reference-anchored
# DPO after two SimPO attempts (dpo_500m_full_v3 with beta=2.0, and
# dpo_500m_simpo_v3b with beta=0.4) both degraded output quality.
# See neuro_simpo_collapse_2026_07_26 memory for the full analysis; short
# version: at 500M scale SimPO's length-normalized reward + no KL anchor is
# unstable, and gen-check text degrades even while loss/accuracy metrics
# look fine.
#
# Rafailov et al. 2023 DPO loss:
#   log_ratio_w = log pi(y_w|x) - log pi_ref(y_w|x)
#   log_ratio_l = log pi(y_l|x) - log pi_ref(y_l|x)
#   L = -log sigmoid( beta * (log_ratio_w - log_ratio_l) )
#
# The KL anchor to pi_ref is exactly what SimPO was missing -- reintroducing
# it costs ~2x VRAM (frozen reference model resident on GPU) and ~2x per-step
# compute (extra forward for the reference), but is the mechanism that keeps
# the policy near the SFT distribution rather than drifting toward cheap
# preference-satisfying local minima.
#
# RECIPE:
#   simpo_enabled: false        <- back to standard DPO
#   dpo_beta: 0.1               <- standard DPO value from the paper
#   batch_size: 5               <- bumped from 3 on the resume restart
#                                  (2026-07-27) after confirming ~9.6GB VRAM
#                                  headroom via nvidia-smi at batch=3
#   max_tokens: 300M            <- ~5 epochs of ultrafeedback binarized
#                                  (~60k pairs at ~2 x 512 tok/pair with
#                                  per_step_tok = 3*4*512*2 = 12288)
#   gen_check_every: 1000       <- catches degradation early (added 2026-07-26
#                                  after SimPO v3b's loss looked fine while
#                                  the model was silently degrading)
#
# BASE: sft_500m_full_v3 (full-FT SFT on refined 500M). UNCHANGED, verified
# undamaged by the earlier degeneration check.
run_name: dpo_500m_standard_v3
dpo_init: sft_500m_full_v3
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512

# --- Standard DPO with reference model ---
simpo_enabled: false
dpo_beta: 0.1

# --- Generation sanity-check ---
gen_check_every: 1000
gen_check_prompt: "The capital of France is"

# --- Full-finetune ---
lora_enabled: false

# --- ARCH: byte-identical to 500m_v3.yaml / sft_500m_full_v3 ---
arch: spiking
vocab: 16384
d: 2048
n_neurons: 4864
d_mem: 2048
n_layers: 5
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
# DPO: policy + reference on GPU. batch=3 measured 22998/32607 MiB used
# (nvidia-smi, 2026-07-27) -> ~9.6GB headroom. Bumped to 5 for the resume
# restart to raise throughput (was ~29-33% GPU util, ~2,000 tok/s at batch=3).
batch_size: 5
grad_accum: 4
eval_batch: 2
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Pretraining/SFT-only knobs: OFF during DPO ---
mqar_aug: false
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs (MUST match base) ---
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Muon+AdamW, gentle DPO LRs (per Rafailov: DPO LR ~= 0.1 * SFT LR) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0005
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.00005
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

max_tokens: 300000000
ckpt_every: 1000
keep_last: 5
log_every: 50
amp: true
compile: true
seed: 0
