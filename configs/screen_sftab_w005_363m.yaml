# flagship_v3 post-training STAGE 1 -- blended SFT.
#
# LAUNCH ONLY AFTER flagship_v3_363m reaches its 10B ceiling (~2026-09-24/25).
# sft_init resolves the run_name to its LATEST checkpoint, so launching early
# would silently fine-tune a partial base.
#
# Three corpora in one stage (src/train_sft.load_sft_corpus concatenates):
#   1. tools.jsonl     TOOL/ANSWER function calling + the two negative classes
#                      (irrelevant-tool, no-tool-needed)               [idea #4]
#   2. coldstart.jsonl Llama-3.2-3B-Instruct rollouts on instruction prompts.
#                      This is the OPD off-policy cold start: the recipe paper
#                      (2604.13016) found it consistently improves final OPD by
#                      closing the student/teacher style gap BEFORE OPD starts.
#                                                                      [idea #1]
#   3. alpaca-cleaned  general instruction data, so the model does not collapse
#                      into a tool-calls-only machine. Blending is the whole
#                      reason these are one stage rather than three.
#
# lut_subword_fallback: TRUE is required here, not optional. The plain encoder
# DROPS every Llama-3 token outside our 32768 student vocab, which turned
# "calculator" into "" and "kilometers" into "ometers" -- it would have silently
# corrupted most tool targets. See src/lut_spell.
#
# Curriculum note: the A-sweep verdict was that curriculum helps RECALL (A1
# reasoning best) and is a WASH downstream, so reasoning-first stays worthwhile
# but is a SEPARATE optional stage (configs/sft_curric_s1_reason_*) -- do not
# fold it in here, or the tool/coldstart signal gets diluted.
#
#   CUDA_VISIBLE_DEVICES=1 python src/train_sft.py --config configs/sft_v3_363m.yaml --device cuda
run_name: screen_sftab_w005_363m

sft_init: flagship_v3_363m
sft_jsonl:
- /home/glenn/projects/neuro/training_data/posttrain/tools.jsonl
- /home/glenn/projects/neuro/training_data/posttrain/coldstart.jsonl
sft_dataset: yahma/alpaca-cleaned
sft_split: train
sft_dataset_frac: 0.5
sft_max_len: 512
lut_subword_fallback: true

gen_check_every: 250
gen_check_prompt: "### Instruction:\nWhat is the capital of France?\n\n### Response:\n"
lora_enabled: false

# --- ARCH: byte-identical to configs/flagship_v3_363m.yaml ---
arch: spiking
vocab: 32768
d: 1280
n_neurons: 3840
d_mem: 1280
n_layers: 9
attention_layer_positions:
- 4
attention_heads: 10
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 4        # 5080/16GB: keep <8 seqs to avoid WDDM spill
grad_accum: 8        # effective batch 32
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true            # 2026-09-26 A/B arm C: MQAR recall rehearsal during SFT
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.05
sparsity_lambda: 0.0      # post-training convention (see sft_curric_s1_reason)
sparsity_target: 0.15
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
gdn2_enabled: true
gdn2_chunked: true
gdn2_gate_norm: true
gdn2_chunk_size: 256      # matches v3 exactly (with ckpt_chunks off)
gdn2_ckpt_chunks: false
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders:
- 2
- 3
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.001
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
muon_precise_gate_filter: true
# head_weight_decay is DELIBERATELY absent (the v3 pretrain reference sets 1.0).
# It exists to damp the head-norm runaway over a 10B-token cosine schedule; this
# stage is ~3.7k steps, and every validated post-training config here
# (sft_flagship_363m, orpo_probe_363m, the curriculum sweep) omits it. Adding it
# would be an untested change to the one part of the stack that has held.
weight_decay: 0.0
lr: 0.0001
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98
max_tokens: 6000000
eval_every: 250
ckpt_every: 250
log_every: 50
keep_last: 6
amp: true
compile: true
seed: 0
