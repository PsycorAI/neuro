# screen_dmem1216_s0_30m (2026-09-10 width-vs-state disentangle). Spends ctrlwide's
# +params on STATE+DIM (d=d_mem 1024->1216, 64.62M) instead of WIDTH (n_neurons).
# Compare recall to ctrlwide (n_neurons 1664, 65.57M, single 98/41/19): if this
# state-arm wins recall at ~matched params, recall's lever is STATE not projection
# width -> motivates larger d_mem / StateX for flagship. n_neurons held at 1024.
# screen_v3levers_ctrl_s0_30m -- v3-lever screen (2026-09-09). 30M, seed 0.
# SHARED CONTROL: current recipe, muon_lr=0.005, uniform MQAR. Baseline for both levers.
# Base recipe = current 30M (screen_headwd_base_s0_30m body), head_wd OFF,
# [4,32]+w0.5. ONE variable vs screen_v3levers_ctrl_s0_30m.
arch: spiking
vocab: 16384
d: 1216
n_neurons: 1024
d_mem: 1216
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
gdn2_chunked: true
gdn2_chunk_size: 64
gdn2_loglinear: false         # ONE-variable delta vs control
gdn2_loglinear_L: 5          # 2^5 = 32 >= n_chunks=8 at block_size=512
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
run_name: screen_dmem1216_s0_30m
seed: 0
watchdog_enabled: false
weight_decay: 0.1
