# GDN-2 dense chunked-WY validation -- the Option-2 verdict run.
# Byte-identical recipe to screen_gdn2_ab_treatment_30m.yaml (the dense-loop
# champion: val_ppl 76.98, MQAR N=16 91%/rank3) except gdn2_chunked: true,
# which routes GDN-2 through delta_chunked.gdn2_chunked_dense -- an EXACT
# WY-form reassociation of the same dense-state math (parity ~1e-6 fwd+bwd
# incl. trained-regime decay; eval-parity on the champion ckpt reproduces its
# recall table exactly). Expect: same ~77 ppl and ~91% N=16 recall as the
# champion, at ~10-40x the training speed (150 vs 5614 ms/step at this scale
# in fp32 smoke). If confirmed -> recipe default for the 500M_v3 restart,
# eliminating GDN-2's ~2x pretraining tax without the fla kernel's
# block-diagonal recall collapse (H>=8 cliff, 2026-07-15).
run_name: screen_gdn2_chunked_dense_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
osdn_enabled: false
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0

gdn2_chunked: true  # dense chunked-WY fast path (default, explicit here for the record)
