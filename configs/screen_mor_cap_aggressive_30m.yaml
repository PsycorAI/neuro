# MoR variation: aggressive capacity schedule [0.4, 0.15] instead of the
# balanced default [0.667, 0.333]. Pushes MORE tokens to exit early (only 15%
# reach full depth vs 33% default) -- tests the efficiency end of the
# quality/compute-savings tradeoff. This directly targets the "faster/cheaper"
# pillar: whatever fraction survives to depth 2 is exactly the fraction that
# will pay refine-transform compute in a Phase 2 (real skip) implementation.
# If val_ppl holds up close to the balanced config's result despite much less
# average depth, that's a substantially better efficiency operating point.
run_name: screen_mor_cap_aggressive_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
ponder_enabled: true
ponder_steps: 3
ponder_capacity: [0.4, 0.15]
ponder_aux_weight: 0.1
ponder_threshold: 0.5
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
