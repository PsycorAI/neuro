# GPU smoke for src/train_opd.py on the 5080. Arch copied from
# sft_flagship_363m.yaml (vocab 32768, n_neurons 3072) so a real 363M
# student runs against the real 3B teacher -- the combination the v3 run
# will use, just 10 steps at batch 4 / 32 new tokens to fit 16GB.
#   CUDA_VISIBLE_DEVICES=1 python src/train_opd.py --config configs/screen_opd_gpu_363m.yaml --device cuda
amp: true
arch: spiking
attention_heads: 10
attention_layer_positions:
- 4
attention_max_seq_len: 4096
attention_qk_norm: true
batch_size: 4
beta_floor: 0.1
block_size: 512
ckpt_every: 5
compile: false
curriculum_block_tokens: 4096
curriculum_enabled: false
curriculum_frac: 0.1
d: 1280
d_mem: 1280
decay_gate: true
delta_rule: true
embed_scale: true
engram_v2_K: 8192
engram_v2_enabled: true
engram_v2_heads: 4
engram_v2_orders:
- 2
- 3
engram_v2_rank: 64
eval_batch: 8
eval_every: 250
fpt_K: 10
fused_ce: true
gdn2_chunk_size: 64
gdn2_chunked: true
gdn2_enabled: true
gdn2_gate_norm: true
gen_check_every: 0
grad_accum: 1
grad_clip: 1.0
keep_last: 2
lam: 0.98
log_every: 1
lora_enabled: false
lr: 2.0e-05
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lut_subword_fallback: true
max_tokens: 1280
mqar_N_max: 16
mqar_N_min: 16
mqar_aug: false
mqar_weight: 0.0
mtp_depth: 2
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
muon_fix_gate_matrices: true
muon_lr: 0.0002
muon_precise_gate_filter: true
muon_route_embeddings_by_type: true
n_layers: 9
n_neurons: 3072
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-08
opd_init: sft_flagship_363m
opd_lambda_out: 1.0
opd_max_len: 256
opd_max_new: 32
opd_prompts: /home/glenn/projects/neuro/training_data/posttrain/coldstart.jsonl
opd_rollouts: 2
opd_teacher: meta-llama/Llama-3.2-3B-Instruct
opd_teacher_compile: false
opd_temperature: 1.0
opd_topk: 16
optimizer: muon
osdn_enabled: false
recurrent: false
recurrent_bptt_k: 0
recurrent_depth: 1
recurrent_router_enabled: false
run_name: screen_opd_gpu_363m
seed: 0
sparsity_lambda: 0.0
sparsity_target: 0.15
use_fla_kernel: false
use_fpt: true
use_rmsnorm: true
vocab: 32768
weight_decay: 0.0
z_loss_weight: 0.0001
