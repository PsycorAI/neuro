# flagship_v3 post-training STAGE 2 -- ORPO on why-narrated + abstention pairs.
#
# ORPO (not DPO/SimPO) because it keeps an explicit SFT-NLL term on the chosen
# response, which is what defended against the likelihood displacement that
# word-souped DPO and SimPO on this memory-heavy pipeline
# (neuro_dpo_retest_2026_08_26_null / neuro_simpo_collapse_2026_07_26).
#
# Three pair sources blended (src/train_dpo concatenates jsonl + HF):
#   1. why.jsonl      CHOSEN opens with one sentence of reasoning.      [idea #5]
#                     Anthropic's result: training on examples of correct
#                     behaviour moved misalignment 22%->15%; training on
#                     responses that state the REASON moved it 22%->3%.
#                     Two pair types are present, both kept:
#                       why_vs_rejected -- reasons AND quality
#                       why_vs_bare     -- reasons ONLY (same answer, unnarrated
#                                          rejected). This is the pair that
#                                          isolates the effect being tested.
#   2. abstain.jsonl  calibrated abstention, BOTH directions.           [idea #2]
#                       unanswerable -- chosen = a specific IDK
#                       answerable   -- chosen = the answer, rejected = a
#                                       needless IDK
#                     Both are required. Train only the unanswerable half and
#                     the model learns to always abstain, which is the standard
#                     failure of this technique.
#   3. ultrafeedback  general preference signal at half weight, so the run is
#                     not purely about reasoning style and abstention.
#
# PRE-REGISTERED CHECKS (same bar as orpo_probe_363m):
#   (a) gen-check stays coherent throughout (DPO went to word-soup by ~step 100)
#   (b) recall_eval --replay split holds vs the SFT base
#   (c) abstention does NOT bleed into answerable questions -- check with
#       scripts/abstain_eval.py, not just the loss
#
#   CUDA_VISIBLE_DEVICES=1 python src/train_dpo.py --config configs/orpo_v3_363m.yaml --device cuda
run_name: orpo_v3_363m

objective: orpo
orpo_lambda: 0.1                   # Hong 2024 default; weak odds-ratio penalty

dpo_init: sft_v3_363m
dpo_jsonl:
- /home/glenn/projects/neuro/training_data/posttrain/why.jsonl
- /home/glenn/projects/neuro/training_data/posttrain/abstain.jsonl
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_dataset_frac: 0.5
dpo_max_len: 512
lut_subword_fallback: true

# Early-collapse detector: DPO word-souped by ~step 100. Check often.
gen_check_every: 100
gen_check_prompt: "### Instruction:\nWhat is the capital of France?\n\n### Response:\n"
lora_enabled: false

# --- ARCH: byte-identical to configs/flagship_v3_363m.yaml ---
arch: spiking
vocab: 32768
d: 1280
n_neurons: 3840
d_mem: 1280
n_layers: 9
attention_layer_positions:
- 4
attention_heads: 10
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 4                      # doubles to 8 seqs (chosen+rejected)
grad_accum: 4
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.15
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
gdn2_enabled: true
gdn2_chunked: true
gdn2_gate_norm: true
gdn2_chunk_size: 256
gdn2_ckpt_chunks: false
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders:
- 2
- 3
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.001
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
muon_precise_gate_filter: true
# head_weight_decay deliberately absent -- see the note in sft_v3_363m.yaml.
weight_decay: 0.0
lr: 0.0001
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98
max_tokens: 30000000
ckpt_every: 500
log_every: 25
keep_last: 6
amp: true
compile: true
seed: 0
