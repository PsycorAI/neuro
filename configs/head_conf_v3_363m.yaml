attention_layer_positions:
- 4
attention_max_seq_len: 4096
attention_qk_norm: true
batch_size: 4
beta_floor: 0.1
block_size: 512
ckpt_every: 500
compile: false
curriculum_block_tokens: 4096
curriculum_enabled: false
curriculum_frac: 0.1
d: 1280
d_mem: 1280
decay_gate: true
delta_rule: true
embed_scale: true
engram_v2_K: 8192
engram_v2_enabled: true
engram_v2_heads: 4
engram_v2_orders:
- 2
- 3
engram_v2_rank: 64
eval_batch: 8
fpt_K: 10
fused_ce: true
gdn2_chunk_size: 256
gdn2_chunked: true
gdn2_ckpt_chunks: false
gdn2_enabled: true
gdn2_gate_norm: true
grad_accum: 1
head_batch: 4
head_init: opd_v3_363m
head_lr: 0.001
head_max_len: 512
head_max_new: 64
head_steps: 1500
head_tools_jsonl: /home/glenn/projects/neuro/training_data/posttrain/tools.jsonl
head_type: confidence
head_wd: 0.01
lam: 0.98
log_every: 50
lr: 0.0001
lut_subword_fallback: true
mqar_N_max: 32
mqar_N_min: 4
mqar_aug: false
mqar_weight: 0.0
mtp_depth: 2
