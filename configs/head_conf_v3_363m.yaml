# Calibrated confidence head on the frozen post-trained v3 model.   [idea #3]
#
# Cactus Needle ships "a calibrated confidence score from a learned head" so the
# harness can route: act, confirm, or refuse. Read at the LAST PROMPT POSITION --
# before the model commits to anything -- so the routing decision can replace the
# action rather than second-guess it after the fact.
#
# Labels are generated ON POLICY inside the training loop: greedy-decode the
# frozen model, compare against the gold tool call, and train on its OWN observed
# correctness. A head trained on some external notion of difficulty would not be
# calibrated to THIS model. That makes each step cost a full greedy decode, hence
# the smaller batch and step count.
#
#   CUDA_VISIBLE_DEVICES=1 python src/train_heads.py --config configs/head_conf_v3_363m.yaml --device cuda
#   CUDA_VISIBLE_DEVICES=1 python scripts/head_eval.py --run head_conf_v3_363m --head confidence --n 200
