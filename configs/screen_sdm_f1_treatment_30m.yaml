# SDM + F1 -- byte-identical to screen_sdm_ab_treatment_30m.yaml except
# muon_fix_gate_matrices: true. Both SDM seeds (seed0_fixed: 83.73/blk1
# COLLAPSED, seed1: 82.67/blk1 COLLAPSED) showed the same F1 pathology on
# W_beta/W_alpha (Newton-Schulz degenerating the 1-row gate matrices) that
# F1 fixed in the NorMuon+Engram-v2 bake (-2.7ppl win there). SDM's own
# memory-Δ (+17 to +33) was suppressed relative to GDN-2's (+244 to +256)
# at the same step -- likely the same collapsed-β mechanism starving SDM's
# write gate. This isolates whether F1 unlocks SDM before it's compared
# against GDN-2 for the 500M memory-rule decision.
run_name: screen_sdm_f1_treatment_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: false
osdn_enabled: false
sdm_enabled: true
sdm_N: 1024
sdm_W: 4
sdm_R: 4
muon_fix_gate_matrices: true
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
