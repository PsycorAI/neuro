# 90M MQAR CONFIRM (treatment): screen_qknorm_90m_s0 recipe + MQAR range
# [4,32] (control = existing screen_qknorm_90m_s0 ckpt, fixed-16). Tests the
# 30M finding (range>fixed for high-N recall) in a hybrid stack (attn@3).
# See neuro_mqar_range_30m_2026_09_03. Recipe ~1mo stale vs flagship but the
# MQAR-range effect is orthogonal to gate-norm/wd.
# 90M QK-norm 3-seed confirm — SEED 0 (5090).
#
# Step 2 of the "path to ready to scale" plan (docs/model_quality_redesign.md,
# memory neuro_redesign_seed_variance_2026_08_01.md): Step 1 (30M QK-norm
# 3-seed screen) WON — seeds converged within ~8% (140.30/149.83/152.06,
# mean 147.40) vs the pre-QK-norm 30M gap of ~90% (142 vs 269) and vs the
# no-attn baseline of 287. This confirms the fix at 3x the parameter count
# before trusting it at real scale.
#
# Deliberately holds sparsity_lambda at 0.3 (the v2 CONTROL value, same as
# the winning 30M screen) rather than bumping to the recommended 0.5 —
# isolating the QK-norm+scale variable instead of conflating it with the
# sparsity lock-in. That combination is a follow-up pass, not this one.
#
# Architecture scaling (d/n_layers/attention position) matches the existing
# screen_new_recipe_v1_90m.yaml pattern exactly (already validated at this
# shape). Only changes vs that file: data_bin/vocab -> v2 top-32k Llama-3
# subset (matching the winning 30M screen's data), attention_qk_norm: true.
run_name: screen_mqar90_range448

data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin

arch: spiking
vocab: 32768
d: 640
n_neurons: 640
d_mem: 640
n_layers: 6
attention_layer_positions: [3]
attention_heads: 8
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 24
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 48
mqar_weight: 0.5
sparsity_lambda: 0.3
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 90000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 200
amp: true
compile: false
seed: 0

kd_enabled: false
watchdog_enabled: false
