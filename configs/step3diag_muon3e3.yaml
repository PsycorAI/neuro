# STEP 3 DIAGNOSTIC ARM — MUON-LR (2026-08-04, 5080 track)
#
# Motivation: arxiv 2607.07953 (Linear Attention Architectures, 2026-07) A/Bd
# Muon vs AdamW at 350M hybrid stack and found Muon prefers a LOWER LR than
# our project's inherited default (recommended ~3e-4 range; we use 5e-3).
# Our 500M v3 recipe locked muon_lr=0.005 empirically at all-spiking
# architecture; the hybrid attention block is a new component whose gradients
# interact differently with Muon's Newton-Schulz orthogonalization.
#
# Baseline: the killed step3_267m_s0 run (muon_lr=0.005). This arm keeps
# EVERYTHING else identical from the killed config (lambda=0.5, AdamW-lr=5e-4,
# schedule, block, etc.) and only changes muon_lr 5e-3 -> 3e-3 (0.6x). If this
# arm looks healthier in the first few thousand steps (spike direction FALLING
# instead of climbing, blk1/2 at_floor staying ~0%), muon_lr is a contributor
# and the fix stacks with whatever the 5090 arms find.
#
# 5080 CONSTRAINTS: 16GB dedicated. batch dropped from Step 3's 28 -> 14 and
# grad_accum 1 -> 2 to keep effective batch identical at 28. VRAM projection
# ~14 GB (linear scaling from probe at batch 28 = 27 GB); leaves ~2 GB margin.
# max_tokens stays at 1.1B for schedule fidelity (see the schedule-fidelity
# trap in neuro_step3_divergence_2026_08_04.md).
run_name: step3diag_muon3e3

data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin

arch: spiking
vocab: 32768
d: 1152
n_neurons: 2752
d_mem: 1152
n_layers: 8
attention_layer_positions: [3]
attention_heads: 9
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 14              # halved for 5080 (from Step 3's 28)
grad_accum: 2               # keeps effective batch at 28
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.003              # the ONE difference from the killed run (was 0.005)
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0005                  # AdamW side unchanged
lam: 0.98
max_tokens: 1100000000      # schedule fidelity — truncated by wall-clock timeout
eval_every: 500
ckpt_every: 8000
keep_last: 1
log_every: 200
amp: true
compile: true
compile_mode: default
compile_dynamic: false
seed: 0

kd_enabled: false
