# 500M-decision piece #3b: 90M de-risk with Batch A folded in. Byte-identical
# to screen_bake_500m_derisk_gdn2_90m.yaml (the curriculum-fixed full-recipe
# de-risk) plus Batch A (RMSNorm+z_loss+deeper MTP+embed_scale w/ paired
# init). Running in parallel with the 30M confirm
# (screen_bake_full_gdn2_batchA_30m) rather than gated behind it -- Batch A's
# 30M win was already large and re-validated (neuro_batch_a_findings.md), so
# this is a calculated parallel bet to save wall-clock before the 500M
# restart decision.
run_name: screen_bake_500m_derisk_gdn2_batchA_90m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 2048
d_mem: 1024
n_layers: 4
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: true
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 400000000
eval_every: 1000
ckpt_every: 1000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
