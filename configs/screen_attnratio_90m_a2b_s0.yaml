# PHASE 1 FOLLOW-UP — placement ablation (2026-08-03).
#
# Purpose: does the arm-B (3:1) recall disaster come from having 2 attention
# layers, or from where they were placed? Original a2 used [3, 6] in an
# 8-layer stack -- attention at layer 6 leaves only ONE spiking layer (7)
# downstream to consolidate the memory pathway before output. Qwen3-Next's
# canonical 3:1 layout is evenly spaced [3, 7, 11, ...], so this trial moves
# the second attention layer from position 6 to 7 -- one deeper -- keeping
# it evenly-ish spaced (3, 7 divides L=8 into thirds roughly) and still
# ending on a spiking layer (which layer 7 no longer is, but the FINAL block
# projects to head anyway so it doesn't matter architecturally).
#
# Actually wait -- with [3, 7] the last block IS the attention block. That's
# a different failure mode risk (attention at output). Trying [2, 5] instead:
# more evenly spaced across the 8-layer stack (positions 2, 5 divide 8 into
# thirds: 0,1,2 | 3,4,5 | 6,7).
#
# NOT changing anything else vs the completed a2_s0 config -- only
# attention_layer_positions and run_name differ.
#
# This is a Step 4 / 1B-design scoping test only. Does NOT affect Step 3's
# already-decided arm A choice.
run_name: screen_attnratio_90m_a2b_s0

data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin

arch: spiking
vocab: 32768
d: 640
n_neurons: 1536
d_mem: 640
n_layers: 8
attention_layer_positions: [2, 5]
attention_heads: 8
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.3
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 150000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 200
amp: true
compile: true
compile_mode: default
compile_dynamic: false
seed: 0

kd_enabled: false
