# Compositionality bake: NorMuon + Engram v2 + F2 (muon_route_embeddings_by_type).
# Byte-identical to screen_bake_normuon_engramv2_combined_30m.yaml except
# muon_route_embeddings_by_type: true -- routes EngramV2.bucket (nn.Embedding
# of shape K*n_tables x rank = 8192*8 x 64 = 65536 x 64 with this config's
# engram_v2_K/heads) from Muon to AdamW. The engram_v2.proj (Linear) stays in
# Muon since it's a genuine 2D hidden-layer matrix.
#
# F2 hypothesis (code-review 2026-07-12): the substring "embed" in name.lower()
# predicate in build_muon_adamw misses EngramV2.bucket, so a sparse-gradient
# lookup table gets Newton-Schulz-orthogonalized + muP-scaled by Muon -- an
# obvious mismatch (Muon's own docstring says embeddings belong in AdamW).
# Engram v2 won its A/B (seed-confirmed) DESPITE this, so there may be free
# gains left on the table at 30M and beyond.
#
# Interpretation guide:
#   - If F2 wins > ~1.5 ppl noise floor: Engram v2's real ceiling is higher
#     than what we've measured. Include in 500M restart.
#   - If F2 is flat or loses: Muon on the sparse-lookup embedding was
#     coincidentally fine; keep the current routing.
#
# One-seed at 30M for direction; if wins, seed1 confirm before promotion.
run_name: screen_bake_normuon_engramv2_f2_bucketadamw_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: false
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_route_embeddings_by_type: true   # F2 -- the only variable vs the confirmed combined-bake control.
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
