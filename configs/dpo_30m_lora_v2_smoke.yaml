# LoRA-DPO smoke on the sft_30m_lora_v2 merged base. NOT a real training run
# -- deliberately tiny (5M tok, ~15 min) to validate the pipeline end-to-end:
#   1. dpo_init loads the merged SFT ckpt cleanly (0/0 state_dict)
#   2. reference model = frozen copy of the same (train_dpo.py handles this)
#   3. LoRA injects fresh adapters onto the policy only
#   4. DPO loss trends down + preference accuracy trends up
#   5. adapter_step_*.pt artifact is produced
# On success, the real LoRA-DPO run just changes max_tokens (and dpo_init once
# the actual 500M merged SFT ckpt exists).
run_name: dpo_30m_lora_v2_smoke
# Absolute path to the merged SFT ckpt (train_dpo.py accepts a path or run_name).
dpo_init: /home/glenn/projects/neuro/models/checkpoints/sft_30m_lora_v2/merged.pt
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512
dpo_beta: 0.1

# --- LoRA on the policy ---
lora_enabled: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [W_q, W_k, W_v]

# --- ARCH: byte-identical to sft_30m_lora_v2 (matches merged base) ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
# DPO doubles VRAM (policy + frozen reference); halve batch_size vs SFT.
batch_size: 8
grad_accum: 2
eval_batch: 4
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Pretraining-only knobs: OFF during DPO ---
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs (MUST match base) ---
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Muon fields (harmless when lora_enabled) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.001
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true

# --- LoRA-DPO LR: same as LoRA-SFT (adapters only) ---
lr: 0.0003
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

# --- Smoke budget: 5M tok is enough to see loss + preference-acc trend ---
max_tokens: 5000000
ckpt_every: 500
keep_last: 2
log_every: 50
amp: true
compile: true
seed: 0
