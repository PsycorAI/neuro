# Compositionality bake: NorMuon + Engram v2 + F1 (muon_fix_gate_matrices).
# Byte-identical to screen_bake_normuon_engramv2_combined_30m.yaml (the
# already-confirmed combined-bake control) except muon_fix_gate_matrices: true
# is added -- so any delta measures F1's contribution alone.
#
# F1 hypothesis (code-review 2026-07-12): Muon's Newton-Schulz on the 1-row
# W_beta/W_alpha matrices reduces to direction-normalization (constant-magnitude
# update regardless of gradient magnitude), plausibly driving β into saturation.
# The 90M combined-bake seed0 showed β=0.10 (floor) on all 4 blocks from step
# 6000 -- confirming the pathology fires in vivo. This test isolates whether
# routing W_beta/W_alpha to AdamW (via fix_gate_matrices) unlocks β modulation
# and improves quality, or if the current dead-β regime is actually what makes
# the combined-bake win work (via Engram v2 compensation).
#
# Interpretation guide:
#   - If F1 wins by > ~1.5 ppl noise floor at 30M: 500M restart MUST include it,
#     β modulation is doing real work.
#   - If F1 loses: current combined-bake recipe is stable AS-IS; the dead-β
#     is a feature, not a bug (Engram v2 has replaced β modulation's role).
#   - If F1 is flat within noise: dead-β is neutral; include F1 for cleanliness.
#
# One-seed at 30M for direction; if wins, seed1 confirm before promotion.
run_name: screen_bake_normuon_engramv2_f1_fixgates_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: false
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true   # F1 -- the only variable vs the confirmed combined-bake control.
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
