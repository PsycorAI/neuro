# LoRA SFT on the 30M base — parameter-efficient variant of sft_30m_mds.yaml.
# Only the delta-rule Q/K/V projections get low-rank adapters; the frozen base
# is loaded from sft_init. Produces a full ckpt (for resume) AND a tiny
# adapter_step_*.pt (the swappable skill mod). Bake with scripts/merge_lora_ckpt.py.
#
# vs full-finetune SFT: a fraction of params train, only adapters get AdamW
# state, and the deliverable is a few-MB adapter instead of a full model copy.
run_name: sft_30m_lora
# Base ckpt: screen_engram_v2_ab_control_30m (seed-confirmed gated-delta baseline
# @ 100M tok, val_ppl 48.03) — the closest existing 30M ckpt to the LoRA arch
# below. Prior config pointed at screen_gated_delta_30m_mqar which was never
# actually run; fixed 2026-07-12. Arch fields below MUST match the base's arch
# (recurrent: false, no SET, fpt_K: 10, batch matched down for VRAM) — a state_
# dict load into a differently-shaped model would fail loudly.
sft_init: screen_engram_v2_ab_control_30m
sft_dataset: yahma/alpaca-cleaned
sft_split: train
sft_max_len: 512

# --- LoRA ---
lora_enabled: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [W_q, W_k, W_v]   # delta-rule projections (attention Q/K/V analog)

arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false          # matches base (screen_engram_v2_ab_control_30m)
block_size: 512
batch_size: 32            # matches the control triad (32/1 fits on 5090 comfortably)
grad_accum: 1
use_fpt: true
fpt_K: 10                 # matches base
delta_rule: true
decay_gate: true
beta_floor: 0.1          # β-collapse fix — recipe default since 2026-07-10
sparsity_lambda: 0.0
sparsity_target: 0.05
# optimizer: forced to AdamW over adapters only when lora_enabled (see train_sft.build_optimizers)
lr: 0.0003               # LoRA tolerates a higher LR than full-finetune SFT
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98
max_tokens: 100000000    # 100M tok, ~1-2h on 5090; enough to see LoRA vs base delta
eval_every: 2000
ckpt_every: 2000
keep_last: 2
log_every: 100
amp: true
compile: false
seed: 0
