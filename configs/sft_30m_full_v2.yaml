# Full-finetune SFT on the current-recipe 30M base — companion to
# sft_30m_lora_v2.yaml. Same base (screen_compile_blk640_30m), same arch,
# same dataset, same token budget — differs only in that ALL params train
# (not just LoRA adapters). Answers: how much quality does LoRA leave on
# the table vs full-finetune, on the current recipe.
#
# LR choice: gentle, ~5x lower than pretraining (Muon 0.005 -> 0.001;
# AdamW 0.0006 -> 0.0001), matching the pattern of the old sft_30m_mds.yaml.
# The base is fully-trained; SFT is refinement, not fresh pretraining. LoRA
# tolerated a higher LR (0.0003) because only tiny adapter matrices trained;
# with full-FT that same LR would destroy the base.
run_name: sft_30m_full_v2
sft_init: screen_compile_blk640_30m
sft_dataset: yahma/alpaca-cleaned
sft_split: train
sft_max_len: 512

# --- Full-finetune: no LoRA ---
lora_enabled: false

# --- ARCH: byte-identical to screen_compile_blk640_30m (matches sft_30m_lora_v2) ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Pretraining-only knobs: OFF during SFT ---
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs (MUST match base) ---
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Muon+AdamW, gentle SFT LRs (~5x lower than pretraining) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.001
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0001
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

max_tokens: 100000000
eval_every: 2000
ckpt_every: 2000
keep_last: 2
log_every: 100
amp: true

# --- compile: true is a STRUCTURAL flag (see sft_30m_lora_v2.yaml note);
#    train_sft.py never calls torch.compile. Set to match the base ckpt's
#    self.lif structure -> clean 0/0 state_dict load. ---
compile: true
seed: 0
