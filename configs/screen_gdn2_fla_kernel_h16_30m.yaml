# GDN-2 fla-kernel arm -- TREATMENT for the dense-vs-multihead A/B.
# Byte-identical to screen_gdn2_ab_treatment_30m.yaml (the dense-loop champion,
# ~76-77 ppl) EXCEPT use_fla_kernel: true. That flag routes GDN-2 through
# fla.ops.gdn2.chunk_gdn2 (delta_chunked.gdn2_fla_gated), whose 256 key-headdim
# cap forces our dense d_mem=1024 memory into a block-diagonal split of H=4
# heads x 256 -- i.e. this arm is MULTI-HEAD GDN-2 (head_dim 256), the GDN
# literature standard, vs the control's single dense 1024x1024 head.
# Kernel integration parity-validated at H=1 (cos_sim 1.0, temp/test_gdn2_fla_parity.py);
# H=4 intentionally diverges from dense (cos_sim 0.53) because it is a different
# (cheaper, ~free-cost) architecture. Decision metric: does multi-head-256 match
# or beat the dense champion on val_ppl + memory-Δ? If yes -> adopt for 500M
# (removes GDN-2's ~2x training slowdown). See docs/gdn2_osdn_design.md.
#
run_name: screen_gdn2_fla_kernel_h16_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: true
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
osdn_enabled: false
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0

gdn2_min_heads: 16  # forced head-count sweep (option-3 diagnostic, vs natural H=4 minimum)
