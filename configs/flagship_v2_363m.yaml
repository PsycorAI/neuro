# flagship_v2 -- 2026-08-29. Deliberate one-lever-only upgrade over
# configs/flagship_363m.yaml, per docs/improvement_plan_2026_08.md Tier-1.
#
# Deltas vs flagship_363m.yaml (ONLY these):
#   run_name         flagship_363m -> flagship_v2_363m
#   max_tokens       5.5e9         -> 1.0e10        (Tier-1 #1: more tokens;
#                                                    ~14.5B corpus available,
#                                                    ~14 tok/param, ~2x killed
#                                                    v1's 4.79B endpoint)
#   lr_schedule      (default:cosine) -> wsd        (Tier-1 #3: token-agnostic
#                                                    scheduler; endpoint stays
#                                                    changeable without re-tune)
#   wsd_decay_frac   (new)         -> 0.15          (15% linear decay tail)
#
# Deliberately NOT changed (each locked upstream, do NOT touch on autopilot):
#   lr=5e-4          The one LR experiment at this shape (W3, 7e-4) was
#                    REJECTED on recall rank despite higher memory-delta --
#                    same ppl-improves-while-recall-regresses failure mode
#                    the plan warns against (see temp/gen_flagship_363m.py
#                    docstring).
#   block_size=512   VRAM wall: 363M @768 @B16 needs 35.4 GB, does not fit
#                    the 5090 (per gen_flagship_363m docstring). A block_size
#                    ramp is Tier-1 #2 in the plan but the loader mechanism
#                    doesn't exist -- deferred to v3 (see conversation
#                    2026-08-29). Sticking to 512 keeps v2 in the reliable-
#                    no-bet regime.
#   recipe           gate-norm + Muon wd + lambda 0.5 + grad_accum 4 +
#                    muon_precise_gate_filter + max-autotune-no-cudagraphs.
#                    2-seed confirmed 2026-08-07/09
#                    ([[neuro-composed-recipe-confirmed-2026-08-07]]).
#   divergence guards val_ppl tripwire + head-norm telemetry + best-ckpt
#                     tracking are all live in train_gpu.py:237 (unit-tested
#                     temp/test_valppl_watchdog.py). They would have caught
#                     v1's 130k head-norm blowup.
#
# ETA: 10.0e9 tokens / (18*4*512 tok/step) / ~7.4k tok/s ~= ~16 days on 5090.
# DO NOT wall-clock-truncate. max_tokens is the real budget; the WSD decay
# needs to actually run.
run_name: flagship_v2_363m
data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin
arch: spiking
vocab: 32768
d: 1280
n_neurons: 3072
d_mem: 1280
n_layers: 9
attention_layer_positions:
- 4
attention_heads: 10
attention_max_seq_len: 4096
attention_qk_norm: true
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 18
grad_accum: 4
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders:
- 2
- 3
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-08
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
weight_decay: 0.1
lr: 0.0005
lam: 0.98
max_tokens: 10000000000
lr_schedule: wsd
wsd_decay_frac: 0.15
eval_every: 2000
ckpt_every: 4000
keep_last: 6
log_every: 1000
amp: true
compile: true
compile_mode: max-autotune-no-cudagraphs
compile_dynamic: false
seed: 0
kd_enabled: false
gdn2_gate_norm: true
snapshot_brain: false
gdn2_chunk_size: 64
muon_precise_gate_filter: true
