# Curriculum warmup A/B -- CONTROL arm (curriculum_enabled: false).
#
# Byte-identical to screen_compile_blk640_30m.yaml (the current-recipe base)
# EXCEPT curriculum_enabled toggled off. Pairs against that config as the
# curriculum-ON treatment (already run, val_ppl 71.48).
#
# This is the current-recipe replay of the July 2026-07-13 curriculum A/B,
# which pre-dated gdn2_chunked / normuon / engram_v2 / mtp / batch_a features.
# The older curriculum-ON run got val_ppl 45.15 vs older control 48.03
# (arXiv:2506.11300 sustained ~3.5% gain); this arm answers whether that
# gain composes with the current recipe or is subsumed by other features.
#
# Test / gate (per docs/to-do.html): val_ppl win > ~1.5 ppl noise floor vs
# treatment, seed1 before adopting. This is seed0 only for now.
run_name: screen_curriculum_off_control_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64

# --- THE ONLY DIFFERENCE vs treatment (screen_compile_blk640_30m) ---
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 500
ckpt_every: 100000
keep_last: 2
log_every: 100
amp: true
compile: true
compile_mode: default
compile_dynamic: false
seed: 0
