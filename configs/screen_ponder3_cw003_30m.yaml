# Adaptive-computation third screen: cost_weight = 0.03 (log-midpoint of the
# two collapsed endpoints).
#   cw=0.01 -> expected_steps 3.000 (always MAX, first screen)
#   cw=0.1  -> expected_steps 1.000 (always MIN, second screen, cw01_30m)
# The sweet spot -- where the halting head actually chooses DIFFERENT step
# counts per token -- must lie in between. This probe brackets it. If cw=0.03
# still flips to one endpoint, the plain mean-steps penalty is fundamentally
# the wrong regularizer shape -- swap for PonderNet's proper KL-to-geometric-
# prior formulation rather than continuing to retune the weight.
#
# Watch on the eval line: [ponder] expected_steps -- want a number BETWEEN
# 1.0 and 3.0 that's stable across evals (and ideally, per-token variance
# visible via a histogram in a later probe).
run_name: screen_ponder3_cw003_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
ponder_enabled: true
ponder_steps: 3
ponder_cost_weight: 0.03
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
