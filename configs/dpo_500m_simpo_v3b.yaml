# SimPO v3b -- CORRECTED after v3's collapse (2026-07-26).
#
# dpo_500m_full_v3 (run_name unchanged from the original DPO->SimPO switch)
# collapsed to incoherent word-salad output by step ~9000 (~184M tok, 37%
# through its 500M-tok budget) and stayed collapsed for the rest of the run.
# Confirmed via direct generation comparison (temp/check_simpo_degeneration.py):
# every one of 5 test prompts produced incoherent/repetitive output on the
# SimPO'd checkpoint vs coherent (if rough) output on the pre-SimPO SFT
# baseline. Killed at step 18000 (~2h before it would have finished) once
# confirmed -- see neuro_simpo_collapse_2026-07-26 memory for full writeup.
#
# ROOT CAUSE: beta=2.0 with NO reference-model KL anchor (that's the whole
# point of SimPO's speed) let the policy freely reshape its output
# distribution to trivially satisfy the margin, with nothing holding it near
# the language-modeling manifold. beta=2.0 is the SimPO paper's value for
# 7B-scale, data-rich, already-well-calibrated models -- it does not transfer
# down to a 479M model straightforwardly.
#
# FIXES in this config:
#   1. simpo_beta: 2.0 -> 0.4 (5x gentler; much less room to blow past a
#      reasonable margin per step)
#   2. simpo_gamma: 0.5 -> 0.15 (scaled down with beta to keep a comparable
#      effective margin threshold)
#   3. max_tokens: 500M -> 150M (hard cap at the healthy zone the failed run
#      showed: loss 0.26-0.4, acc 75-95%, still improving, around 120-165M tok)
#   4. gen_check_every: 1000 (NEW -- prints real generated text every 1000
#      steps so a collapse like this is visible in the log within minutes,
#      not discovered ~2h later externally)
#   5. run_name changed to dpo_500m_simpo_v3b to avoid confusion/overwrite
#      with the damaged v3 checkpoints (kept on disk as a reference).
#
# Base: sft_500m_full_v3 (full-FT SFT on refined 500M) -- UNCHANGED, confirmed
# undamaged by the same degeneration check.
run_name: dpo_500m_simpo_v3b
dpo_init: sft_500m_full_v3
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512

# --- SimPO parameters (corrected) ---
simpo_enabled: true
simpo_beta: 0.4      # was 2.0 -- 5x gentler
simpo_gamma: 0.15    # was 0.5 -- scaled down with beta
dpo_beta: 0.1         # kept for backwards-compat; ignored when SimPO on

# --- Generation sanity-check (NEW 2026-07-26) ---
gen_check_every: 1000
gen_check_prompt: "The capital of France is"

# --- Full-finetune ---
lora_enabled: false

# --- ARCH: byte-identical to 500m_v3.yaml / sft_500m_full_v3 ---
arch: spiking
vocab: 16384
d: 2048
n_neurons: 4864
d_mem: 2048
n_layers: 5
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 5
grad_accum: 4
eval_batch: 2
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Pretraining/SFT-only knobs: OFF during DPO/SimPO ---
mqar_aug: false
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs (MUST match base) ---
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Muon+AdamW, gentle DPO LRs (unchanged -- LR was not implicated) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0005
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.00005
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

# Hard-capped at the healthy zone (was 500M).
max_tokens: 150000000
ckpt_every: 1000
keep_last: 5
log_every: 50
amp: true
compile: true
seed: 0
