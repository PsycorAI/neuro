# SDM A/B -- TREATMENT arm (sdm_enabled: true). Sparse N-slot PKM-addressed
# memory (arXiv:2607.07386) replaces the dense delta-rule read/write. See
# docs/sdm_design.md. Byte-identical to screen_gdn2_osdn_ab_control_30m.yaml
# (the shared GDN-2/OSDN control) except the sdm_* flags, so this measures
# the memory-capacity mechanism against the same baseline GDN-2/OSDN were
# measured against.
#
# Sizing: N=1024=d_mem (phase-3 scope constraint -- square-state, see
# docs/sdm_design.md phase 3 note), W=R=4 per docs/sdm_design.md's 30M
# screen sizing plan. sqrt(N)=32, so PKM outer-sum is a 32x32=1024 score
# grid, top-4 selection.
run_name: screen_sdm_ab_treatment_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: false
osdn_enabled: false
sdm_enabled: true
sdm_N: 1024
sdm_W: 4
sdm_R: 4
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
