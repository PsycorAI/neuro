# GDN-2 A/B -- TREATMENT arm, SEED1 CONFIRM. seed0 WON decisively (val_ppl
# 76.98 vs control 81.87, -4.9 ppl past the ~1.5 ppl noise floor; memory-Δ
# +304.5 stable; both β blocks healthy μ=0.53/0.59, not floor-saturated).
# Byte-identical to screen_gdn2_ab_treatment_30m.yaml except seed: 0 -> 1.
# Gate: docs/gdn2_osdn_design.md requires a seed1 confirm before folding into
# the next 500M -- this project's history has 3 confirmed instances (MoE,
# Engram v1, recurrent-depth) of a single-seed win reversing on reseed.
run_name: screen_gdn2_ab_treatment_seed1_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
osdn_enabled: false
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 1
