# 90M-target scaling-check for the model_quality_redesign recipe (2026-07-31).
# Actual param count came in at 68M via build_model dry-run (embed+head at
# 42M dominate; only 26M "compute" params for the blocks). Left as-is:
# the point of this screen is scaling BEHAVIOR (recipe stability at bigger
# scale), and 35M -> 68M is a genuine 2x jump. At 68M x 90M tokens the
# tok/param ratio is 1.3 — slightly better than the 30M screen's 0.86.
# Second-scale de-risk after screen_new_recipe_v1_30m.yaml showed the
# recipe trains cleanly end-to-end. Confirms it stays healthy at ~3x
# the parameter count.
#
# ONLY changes vs screen_new_recipe_v1_30m.yaml:
#   d/n_neurons/d_mem  : 384 -> 640          (~1.7x width)
#   n_layers           : 4 -> 6              (adds 2 more spiking layers)
#   attention_layer_positions: [2] -> [3]    (middle of the deeper stack)
#   max_tokens         : 30M -> 90M          (keeps ~1 tok/param ratio,
#                                             matching the 30M screen)
# Everything else UNCHANGED so any divergence is purely a scaling artifact.
#
# Expected wall-clock: ~2h at ~10-12k tok/s (90M model = ~2x FLOPs/step
# vs 30M model, so throughput roughly halves).
run_name: screen_new_recipe_v1_90m

data_bin: /home/glenn/projects/neuro/data/tok_32k/train_32k.bin

arch: spiking
vocab: 32768
d: 640
n_neurons: 640
d_mem: 640
n_layers: 6
attention_layer_positions: [3]
attention_heads: 8
attention_max_seq_len: 4096
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 24                     # slightly smaller vs 32 for the bigger model
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.3
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 90000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 200
amp: true
compile: false
seed: 0
