# 500M-decision piece #3 (GDN-2 variant): 90M final-recipe de-risk.
# Byte-identical to bake_normuon_engramv2_combined_90m_seed1.yaml (the
# confirmed 90M NorMuon+Engram-v2 bake, 46.98 val_ppl) except F1
# (muon_fix_gate_matrices), F2 (muon_route_embeddings_by_type), and
# gdn2_enabled added -- the full candidate 500M recipe, scaled to 90M as
# the last de-risking step before committing 500M compute.
#
# Only launch once screen_bake_full_gdn2_30m confirms composition holds at
# 30M. This is the 90M analog of the 30M combined bake -- same de-risk
# pattern used for NorMuon+Engram-v2 before the 500M decision.
#
# 2026-07-15: added curriculum_enabled -- this config predates curriculum's
# seed1 confirm (two-seed win: 45.15/46.72 vs control 48.03) and was missing
# it. screen_bake_full_gdn2_30m (already run, 72.26) was ALSO missing it --
# so this 90M run is the first to carry the complete confirmed recipe.
run_name: screen_bake_500m_derisk_gdn2_90m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 2048
d_mem: 1024
n_layers: 4
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: true
curriculum_frac: 0.1
curriculum_block_tokens: 4096
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true          # F1
muon_route_embeddings_by_type: true   # F2
lr: 0.0006
lam: 0.98
max_tokens: 400000000
eval_every: 2000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
