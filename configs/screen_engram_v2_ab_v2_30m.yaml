# Engram v2 A/B -- TREATMENT arm (Engram v2 enabled).
# Byte-identical to screen_engram_v2_ab_control_30m.yaml except
# engram_v2_enabled:true (residual-stream injection, multi-head hashing,
# multi-granular n-grams). Same seed=0 -> identical data order, so any
# factual-eval delta at matched tokens isolates the v2 mechanism.
#
# Sizing: PARAM-PARITY with v1. v1 used K=32768 x rank=64 in ONE table = 2.1M
# in buckets + 32768*rank->vocab ~1M proj = ~3.1M. v2 uses 4 tables (2 orders
# x 2 heads), so K per table = 32768/4 = 8192 keeps bucket total identical
# at 4*8192*64 = 2.1M. Proj goes to d=1024 (residual dim) not vocab, so
# rank*n_tables*d = 256*1024 = 0.26M. Total v2 ~2.4M -- slightly SMALLER
# than v1, so if v2 wins the A/B it can only be the residual-injection
# redesign (+ multi-head collision robustness), not parameter count.
# If we later find v2 helps AND want more capacity: bump engram_v2_K.
#
# Read the result with: scripts/engram_factual_eval.py --run <this run>.
# Success = measurable Δ in log-prob / rank vs the CONTROL arm at matched
# tokens, AND measurable Δ within THIS run between the enabled and ablated
# forward passes (the ablate_engram_v2 flag).
run_name: screen_engram_v2_ab_v2_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: true
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: false
sparsity_lambda: 0.5
sparsity_target: 0.05
engram_v2_enabled: true
engram_v2_orders: [2, 3]
engram_v2_K: 8192
engram_v2_heads: 2
engram_v2_rank: 64
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 2000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
