# GDN-2 / OSDN A/B -- shared CONTROL arm (standard gated delta rule).
# See docs/gdn2_osdn_design.md. Byte-identical to the two treatment configs
# (screen_gdn2_ab_treatment_30m.yaml, screen_osdn_ab_treatment_30m.yaml) except
# the single mechanism flag (gdn2_enabled / osdn_enabled), so any difference is
# the memory rule alone.
#
# Recipe choices:
#   - recurrent_depth 1 / router OFF: isolate the memory-rule variable, don't
#     confound with MoR (each testable separately) -- same isolation logic as
#     the Engram v2 screen.
#   - mqar_aug ON: GDN-2/OSDN both target in-context k->v recall, so exercise it
#     (memory-Δ + val_ppl are the decision metrics).
#   - delta_rule + decay_gate + beta_floor:0.1: our standard modern baseline, so
#     the treatments are measured against a real base, not a strawman.
#   - use_fla_kernel OFF on ALL arms: the GDN-2/OSDN treatments have only the
#     eager sequential-loop kernel for now, so the control also runs the eager
#     chunked delta path -- arms differ in math, not kernel implementation.
run_name: screen_gdn2_osdn_ab_control_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
gdn2_enabled: false
osdn_enabled: false
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
