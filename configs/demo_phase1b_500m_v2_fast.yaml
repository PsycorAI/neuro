# 500M v2 — faster variant. Byte-identical to demo_phase1b_500m_v2.yaml EXCEPT:
#   1. batch_size 6->10, grad_accum 5->3 (eff batch 30->30; kept effectively
#      the same. Reason: fewer microsteps per step = fewer kernel launches +
#      more work per teacher fwd; the KD teacher currently dominates step time
#      and its cost is roughly linear in microsteps × batch_size. VRAM: current
#      run sits at ~22.5/32GB on the 5090; batch_size 6->10 lifts per-microstep
#      activations accordingly. Settled on 10x3 (see
#      demo_phase1b_500m_v2_fast_aggressive.yaml for context) after headroom
#      checked out; live run sits at ~27-29GB.).
#   2. kd_compile: true, compile_mode: default (torch.compile the frozen
#      Phi-3.5-mini teacher). "default" was chosen over "reduce-overhead"
#      after a 2026-07-06 first-swap attempt with reduce-overhead pinned VRAM
#      at 32032/32607 MiB and spilled ~1.8 GB to shared/host memory over
#      PCIe (paging every step -> 4475 tok/s vs 5841 baseline). reduce-
#      overhead's CUDA-graph replay preallocates too aggressively for our
#      batch. "default" mode keeps all inductor fusion/reordering wins but
#      does NOT record CUDA graphs; ~1-3 GB less VRAM. Projected total
#      ~27-29 GB with batch 10x3 = safe headroom. Math is preserved either
#      way (compile is a numerics-preserving transformation up to
#      matmul-associativity noise). Model quality/integrity NOT affected.
#   3. keep_last: 2 -> 8 (enables meaningful PMA soup at run end; scripts/
#      pma_average.py works with any N but the memory note recommends >=8).
# Not a resume-compatible rename (run_name changed) -- when swapping to this
# config, copy the newest step_*.pt from the old run_name dir into this one's
# ckpt dir first so the trainer's autoload picks it up.

run_name: demo_phase1b_500m_v2_fast
arch: spiking

data_bin: /home/glenn/projects/bdh/data/tokenized_phi/train.bin
data_orig_vocab: 32064
vocab: 32064

d: 2048
n_neurons: 4864
d_mem: 2048
n_layers: 5
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200


# > 15 x 2, block 512, ~9100 tok/s with 31.4 VRAM usage + 1.4 spillover
# 15 x 2, block 640 OOM spillover
# 10 x 3, block 640, ~8400 tok/s with 31.4 VRAM usage + 1.4 spilloer
# 15 x 2, block 640, ~slow10 x 3 tok/s with 31.4 VRAM usage + 5.6GB spillover
# 10 x 3, block 768, ~slow tok/s with 31.4 VRAM usage + 1.5GB spillover
# 10 x 3, block 640, ~7800 tok/s with 30.0 VRAM usage, 6.7GB spillover
# 10 x 3, block 512, ~8200 tok/s with 30.0 VRAM usage
# 10 x 3, block 768, OOM
# 10 x 3, block 1024, OOM
#  8 x 4, block 1024 OOM
#  8 x 4, block 768, ~7900 tok/s, initial 30.0 VRAM > 6.7 spillage.
#  8 x 4, block 512, ~7000 tok/s with 6.7 VRAM spillage
# 10 x 3, block 512 ~8000 tok/s with 28.3 VRAM usage > 6.7GB spillage later.
# 16 x 2, produces ~7200 tok/s with 2.3 VRAM spillage
# 30 x 1, produces OOM
block_size: 512
batch_size: 15
grad_accum: 2
eval_batch: 4

use_fpt: true
fpt_K: 10
delta_rule: true
decay_gate: true
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5

sparsity_lambda: 0.5
sparsity_target: 0.05

mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

depth_scaled_init: true
weight_decay: 0.1

markov_enabled: true
markov_rank: 64
confidence_enabled: true
confidence_weight: 0.05

adamw_8bit: false
fused_ce: true

optimizer: muon
muon_lr: 0.005
lr: 0.0004
lam: 0.98

kd_enabled: true
kd_teacher: microsoft/Phi-3.5-mini-instruct
kd_alpha: 0.5
kd_temperature: 1.0
kd_compile: true
kd_compile_mode: default
kd_teacher_int8: false

max_tokens: 5000000000
eval_every: 2000
ckpt_every: 2000
keep_last: 8
log_every: 100

amp: true
compile: false
use_fla_kernel: true
seed: 0
