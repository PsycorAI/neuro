# 500M v2 — faster variant. Byte-identical to demo_phase1b_500m_v2.yaml EXCEPT:
#   1. batch_size 6->8, grad_accum 5->4 (eff batch 30->32; kept effectively
#      the same. Reason: fewer microsteps per step = fewer kernel launches +
#      more work per teacher fwd; the KD teacher currently dominates step time
#      and its cost is roughly linear in microsteps × batch_size. VRAM: current
#      run sits at ~22.5/32GB on the 5090; batch_size 6->8 lifts per-microstep
#      activations by ~1.33x. Non-static allocation is ~7-8GB of that 22.5, so
#      the delta is ~2-3GB -> ~25-26GB projected, still ~6GB headroom.
#      Conservative choice; see demo_phase1b_500m_v2_fast_aggressive.yaml for
#      the 10x3 variant.).
#   2. kd_compile: true (torch.compile the frozen Phi-3.5-mini teacher).
#      Reduces the dominant step-time contributor. compile_mode
#      "reduce-overhead" uses CUDA graphs; drop to "default" if it errors on
#      first launch (HF output-dataclass boundary or KV-cache tracing).
#   3. keep_last: 2 -> 8 (enables meaningful PMA soup at run end; scripts/
#      pma_average.py works with any N but the memory note recommends >=8).
# Not a resume-compatible rename (run_name changed) -- when swapping to this
# config, copy the newest step_*.pt from the old run_name dir into this one's
# ckpt dir first so the trainer's autoload picks it up.

run_name: demo_phase1b_500m_v2_fast
arch: spiking

data_bin: /home/glenn/projects/bdh/data/tokenized_phi/train.bin
data_orig_vocab: 32064
vocab: 32064

d: 2048
n_neurons: 4864
d_mem: 2048
n_layers: 5
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200

block_size: 512
batch_size: 8
grad_accum: 4
eval_batch: 4

use_fpt: true
fpt_K: 10
delta_rule: true
decay_gate: true
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5

sparsity_lambda: 0.5
sparsity_target: 0.05

mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

depth_scaled_init: true
weight_decay: 0.1

markov_enabled: true
markov_rank: 64
confidence_enabled: true
confidence_weight: 0.05

adamw_8bit: false
fused_ce: true

optimizer: muon
muon_lr: 0.005
lr: 0.0004
lam: 0.98

kd_enabled: true
kd_teacher: microsoft/Phi-3.5-mini-instruct
kd_alpha: 0.5
kd_temperature: 1.0
kd_compile: true
kd_compile_mode: reduce-overhead

max_tokens: 5000000000
eval_every: 1000
ckpt_every: 1000
keep_last: 8
log_every: 100

amp: true
compile: false
use_fla_kernel: true
seed: 0
