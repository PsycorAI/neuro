# SWITCHED TO SimPO 2026-07-23 (was full DPO). Config filename kept as
# dpo_500m_full_v3 because the running waiter has this path hardcoded; the
# semantic switch is via simpo_enabled: true.
#
# SimPO (arXiv:2405.14734, Meng et al.): reference-free preference optimization
# using length-normalized average-logp reward and a target margin gamma.
# Loss: -log sigma( beta * (avg_logp_w - avg_logp_l) - gamma )
#
# Why SimPO for 500M v3 DPO:
#  - No reference model on GPU -> ~50% VRAM savings vs standard DPO
#  - Can double batch_size (was 3 for DPO) without OOM risk
#  - Skip the full reference forward every step -> halves per-step compute
#  - Combined: ~4-5h wall time instead of DPO's ~23h at 500M tok
#  - Quality: paper reports +6.4pt AlpacaEval2, +7.5pt Arena-Hard vs DPO
#
# SimPO smoke on 30M full-FT SFT'd base VALIDATED 2026-07-23:
#   - Pipeline runs end-to-end (SimPO reference-free banner in log)
#   - Loss finite, converges directionally at 5M smoke scale
#   - Spike telemetry present (spike 0.260-0.265 preserved from SFT)
#   - VRAM 2.1/12.1 GB at batch=16 on 5080 (30M model)
#   - See logs/simpo_30m_smoke.txt for full trajectory
#
# Base: sft_500m_full_v3 (full-FT SFT on refined 500M).
run_name: dpo_500m_full_v3
dpo_init: sft_500m_full_v3
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512

# --- SimPO parameters (dpo_beta unused when simpo_enabled: true) ---
simpo_enabled: true
simpo_beta: 2.0     # SimPO paper: ~2.0 for 7B-scale; higher than DPO's 0.1
simpo_gamma: 0.5    # target reward margin; conservative starting value
dpo_beta: 0.1       # kept for backwards-compat; ignored when SimPO on

# --- Full-finetune ---
lora_enabled: false

# --- ARCH: byte-identical to 500m_v3.yaml ---
arch: spiking
vocab: 16384
d: 2048
n_neurons: 4864
d_mem: 2048
n_layers: 5
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
# SimPO: policy only on GPU (no reference) -> larger batch than DPO's 3.
# Conservative bump to 5 (still leaves headroom; can raise via re-probe later).
batch_size: 5
grad_accum: 4
eval_batch: 2
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- Pretraining/SFT-only knobs: OFF during DPO ---
mqar_aug: false
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

# --- Model-arch knobs (MUST match base) ---
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

# --- Muon+AdamW, gentle DPO LRs (2x lower than SFT) ---
optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0005
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.00005
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

max_tokens: 500000000
ckpt_every: 2000
keep_last: 3
log_every: 50
amp: true
compile: true
seed: 0
