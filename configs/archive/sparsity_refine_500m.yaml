# Post-500M-pretrain Refinement #2 -- Push spike rate 0.069 -> ~0.05 target.
# +50M tokens with sparsity_lambda 2x pretrain, LR 0.5x, no MQAR-aug, no KD.
# Continues from mqar_refine_500m's final ckpt so MQAR gains carry through.
#
# NOTE ON PREMISE (2026-07-10): The original config was written when spike was
# 0.13 and the goal was 0.13 -> 0.08. Current 500M v2 fast has spike 0.069
# already (below the old target). This refine is now OPTIONAL -- run it only
# if you want to push the last 0.02 toward the config's 0.05 sparsity_target
# for the "low-energy" pillar of the demo. If you skip it, the mqar_refine
# output is already fine for SFT.
#
# Rewritten 2026-07-10 to match live arch (was n_neurons: 4352 stale, no
# beta_floor, missing all July-since features). Reduced sparsity_lambda from
# 3.0 to 1.0 given the much smaller gap to close.
#
# ---------- Launch procedure ----------
# 1. Wait for mqar_refine_500m to finish (~5.05B tok).
# 2. Copy its final ckpt into this run's ckpt dir:
#      mkdir -p models/checkpoints/sparsity_refine_500m
#      cp models/checkpoints/mqar_refine_500m/step_*.pt \
#         models/checkpoints/sparsity_refine_500m/
# 3. Launch on whichever GPU is free.
#
# ---------- Success criteria ----------
#   - spike drops toward 0.05 (target). Even 0.06 is a real win.
#   - val_ppl doesn't regress by more than ~0.3 (some regression IS expected
#     under stronger sparsity penalty; the tradeoff must remain net-positive).
#   - memory-Δ stays roughly where mqar_refine left it (don't undo the recall).
#   - β dead_frac stays 0% on all blocks.
run_name: sparsity_refine_500m

data_bin: /home/glenn/projects/bdh/data/tokenized_phi/train.bin
data_orig_vocab: 32064
vocab: 32064

# --- ARCH: byte-identical to pretrain + mqar_refine ---
arch: spiking
d: 2048
n_neurons: 4864
d_mem: 2048
n_layers: 5
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200

block_size: 512
batch_size: 15
grad_accum: 2
eval_batch: 4

use_fpt: true
fpt_K: 10
delta_rule: true
decay_gate: true
beta_floor: 0.1

# --- MQAR-AUG OFF: keep the mqar_refine gains, don't retrain the recall path
mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5

# --- Sparsity: 2x pretrain lambda (was 3x in old config, but the gap is now
#    ~0.02, not ~0.08 -- softer push is enough and safer for ppl) ---
sparsity_lambda: 1.0
sparsity_target: 0.05

# --- Recipe features (identical to pretrain + mqar_refine) ---
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
depth_scaled_init: true
weight_decay: 0.1
markov_enabled: true
markov_rank: 64
confidence_enabled: true
confidence_weight: 0.05
adamw_8bit: false
fused_ce: true
use_fla_kernel: true

# --- Gentler LR than mqar_refine (0.5x) since we're now optimizing an already-
#    recall-refined model; big steps risk overshooting the sparsity target and
#    damaging quality/memory ---
optimizer: muon
muon_lr: 0.0025
lr: 0.0002
lr_min_frac: 1.0
lr_warmup_frac: 0.0
lam: 0.98

kd_enabled: false

# +50M tokens on top of mqar_refine's 5.05B => 5.10B total.
max_tokens: 5100000000
eval_every: 500
ckpt_every: 500
keep_last: 8
log_every: 100
amp: true
compile: false
seed: 0
