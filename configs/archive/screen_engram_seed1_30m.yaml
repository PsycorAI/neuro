# Engram seed-1 confirmation. Identical to screen_engram_30m except seed: 1.
# The seed0 run ended at val_ppl 75.66 (beats control 81.20) with a large,
# growing memory-Δ suggesting the Engram pathway's contribution is real -- but
# the MoE Phase 1 lesson (both standout single-seed wins failed to reproduce on
# seed1) means this MUST be seed-confirmed before we trust it or scale it up.
# Watch: does the final val_ppl again land clearly below ~81.20 with a similar
# trajectory shape?
run_name: screen_engram_seed1_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
engram_enabled: true
engram_n: 3
engram_K: 32768
engram_rank: 64
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 1
