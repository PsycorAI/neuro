# MoR expert-choice seed-1 confirmation. Identical to screen_mor_refine_30m
# except seed: 1. Non-negotiable before trusting the seed0 result -- the MoE
# Phase 1 sweep taught us this sweep-family is noisy enough (15-20 ppl swings)
# that single-seed wins are not to be trusted, however clean the mechanism.
# Unlike the collapsed PonderNet screens, this mechanism CAN'T collapse -- but
# "collapse-proof" only means the depth_hist stays non-degenerate; it says
# nothing about whether the val_ppl improvement itself is a real, reproducible
# effect vs. seed noise. Check that here.
run_name: screen_mor_refine_seed1_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
ponder_enabled: true
ponder_steps: 3
ponder_aux_weight: 0.1
ponder_threshold: 0.5
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 1
