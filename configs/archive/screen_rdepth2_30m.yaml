# Recurrent-depth Stage 1: FIXED depth-2 latent looping of the block stack.
# The literature-optimal adaptive-compute design (Geiping/Huginn recurrent depth
# + "Universal Transformers Need Memory": loop the ACTUAL Hebbian block sharing
# its memory, NOT a bolted-on module on the final hidden state). Stage 1 is
# fixed-depth (no per-token router yet) to test the ONE load-bearing hypothesis
# cheaply before building the adaptive router on top:
#   (a) does depth-2 BEAT depth-1 (= control 81.20) on val_ppl, and
#   (b) does memory-ablation Δ stay BOUNDED (comparable to other configs at this
#       recipe, i.e. tens) -- unlike the old ponder bolt-on whose Δ blew up to
#       ~1000 and kept climbing.
# If both hold, Stage 2 adds the MoR capacity router for per-token adaptive depth
# + depth sampling for test-time scalability.
#
# Byte-identical to the control recipe (gated-delta + decay_gate + MQAR-aug)
# EXCEPT recurrent_depth: 2. NOTE: `recurrent: false` here is the block-INTERNAL
# SET recurrence (rec_density) -- orthogonal to recurrent_depth, which loops the
# whole stack in latent space. Leave it false; only recurrent_depth is the knob.
run_name: screen_rdepth2_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 2          # loop the block stack twice (input-injected each pass)
recurrent_bptt_k: 0         # 0 = full backprop through both passes (fine at R=2)
block_size: 512
batch_size: 16              # eff batch 16*2=32 MATCHES control (fair A/B), while
grad_accum: 2               # halving per-microstep activation offsets R=2's ~2x
                            # memory -> comfortably under the 5080's 16GB.
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
