# FIX A/B (fix 2 of 2): vector (per-channel) beta instead of scalar. Aligns
# with NVIDIA's Gated DeltaNet-2 (arXiv 2605.22791) fix -- per-value-axis
# channel-wise write gate, so collapse would require ALL d_mem=1024 channels
# to saturate simultaneously (near-impossible vs one scalar).
#
# Byte-identical to screen_rdepth2_mor_200mtok_30m.yaml except vector_beta:
# true. Same seed=0, same 200M tokens, direct A/B against the +2.35 baseline
# and against fix-1 (beta_floor). No beta_floor set here to isolate the
# vector-vs-scalar variable.
#
# COST: vector_beta triggers a SEQUENTIAL memory loop in forward_sequence
# (the chunked/FLA delta kernel assumes scalar beta). At 30M scale + block
# 512 this is manageable but slower per-step than the scalar path. If the
# fix works and we promote it to 90M+, we'd want to rewrite the chunked
# kernel to support vector beta (deferred cost).
#
# Success = memory-delta stays meaningfully > baseline's +2.35 AND above
# beta_floor variant, OR at least matches beta_floor -- with the added
# benefit of finer per-channel control that beta_floor can't give.
run_name: screen_mor_vector_beta_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 2
recurrent_bptt_k: 0
recurrent_router_enabled: true
recurrent_router_threshold: 0.5
recurrent_router_aux_weight: 0.1
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
use_fla_kernel: true
fused_ce: true
delta_rule: true
decay_gate: true
vector_beta: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 200000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
