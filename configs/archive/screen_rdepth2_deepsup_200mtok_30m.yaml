# Phase 1: per-pass DEEP SUPERVISION on top of depth-2 @ 200M. Every
# successful 2026 looped-model recipe (Ouro, LoopFormer) applies the LM loss
# at EVERY pass exit, not just the final one -- our depth-2 screens never did
# this, likely explaining their unusually slow convergence (still falling
# steeply at budget end while sibling configs plateau). This adds CE at the
# pass-0 exit with weight 0.3 (conservative -- the literature also warns
# dense/aggressive per-loop supervision can cause hidden-state norm growth
# under RMSNorm, "Readout Blind Spot"/"norms grow unchecked" 2026 findings;
# 0.3 is a deliberately soft first bet, not the field's typical 1.0, given we
# have no entropy regularizer or per-loop norm control to counteract it).
# grad_clip: 1.0 (already in this recipe) is the safety net if pass-0's
# early-training logits are noisy/large.
#
# Only launch AFTER Phase 0 (screen_rdepth1_200mtok_30m/_seed1) resolves
# whether depth-2 already beats a FAIRLY-matched depth-1 control. If yes:
# this becomes the "can we do even better" follow-up. If no: this is the
# candidate fix for a still-real-but-slow-converging effect.
# Byte-identical to screen_rdepth2_200mtok_30m EXCEPT recurrent_deep_supervision
# and recurrent_pass_weights.
run_name: screen_rdepth2_deepsup_200mtok_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 2
recurrent_deep_supervision: true
recurrent_pass_weights: [0.3]          # loop the block stack twice (input-injected each pass)
recurrent_bptt_k: 0         # 0 = full backprop through both passes (fine at R=2)
block_size: 512
batch_size: 16              # eff batch 16*2=32 MATCHES control (fair A/B), while
grad_accum: 2               # halving per-microstep activation offsets R=2's ~2x
                            # memory -> comfortably under the 5080's 16GB.
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 200000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
