# Hebbian-MoE Phase 1 bisect -- CONTROL (n_experts=1, i.e. no MoE).
# Identical to screen_gated_delta_30m_mqar (the clean gated-delta+MQAR
# baseline, no Batch A/B/C extras) except recurrent:false -- recurrent SET
# connections aren't implemented in MoEHebbianBlock yet, so the control must
# drop them too or the comparison is confounded.
#
# Compare final val_ppl / ablated_ppl / memory-delta against
# screen_moe4_30m at matched tokens. If MoE doesn't beat this control,
# specialization isn't earning its extra params -- don't build Phase 2.
run_name: screen_moe_control_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
