# 90M MoR seed1 validation with vector_beta=true fix.
# Byte-identical to screen_rdepth2_mor_90m_seed1.yaml EXCEPT vector_beta: true.
# Slower than beta_floor variant (sequential memory loop, chunked kernel is
# scalar-β only) but a more principled fix per NVIDIA Gated DeltaNet-2.
run_name: screen_rdepth2_mor_90m_seed1_vector_beta
arch: spiking
vocab: 16384
d: 1024
n_neurons: 2048
d_mem: 1024
n_layers: 4
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200
recurrent_depth: 2
recurrent_bptt_k: 0
recurrent_router_enabled: true
recurrent_router_threshold: 0.5
recurrent_router_aux_weight: 0.1
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: true
fused_ce: true
delta_rule: true
decay_gate: true
vector_beta: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 400000000
eval_every: 2000
ckpt_every: 4000
keep_last: 2
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 1
