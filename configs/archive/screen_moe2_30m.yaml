# Hebbian-MoE Phase 1 bisect -- N=2 experts, soft/dense routing.
# Identical to screen_moe_control_30m (same dims, same clean gated-delta+MQAR
# recipe, recurrent off) except n_experts:4. Each expert gets the FULL d_mem
# (not a split fraction, unlike n_heads) -- real per-expert capacity.
# Eager kernel (use_fla_kernel off) on purpose: isolates the MoE-specialization
# question from the fla diagonal-block-split question (already being screened
# separately in screen_batchA_90m_fla). Don't conflate the two variables.
#
# Compare final val_ppl / ablated_ppl / memory-delta / expert routing entropy
# against screen_moe_control_30m at matched tokens.
run_name: screen_moe2_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
block_size: 512
batch_size: 16
grad_accum: 2   # B*E=16*2experts=32 through the memory kernel -- matches
                # control's footprint (fits 16GB); effective batch stays 32
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
n_experts: 2
moe_aux_weight: 0.01
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 500
ckpt_every: 1000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
