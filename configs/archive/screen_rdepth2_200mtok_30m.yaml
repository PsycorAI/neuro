# Recurrent-depth follow-up: depth-2 at 2x token budget (200M, fresh run).
# Stage 1 (screen_rdepth2_30m, 100M tok) FAILED criterion (a): final val_ppl
# 91.59 vs control 81.20 -- but its eval curve was still falling steeply at
# budget end (97.8 -> 95.7 -> 91.6) while sibling configs plateau by then, and
# criterion (b) qualified-PASSED (memory delta bounded and DECLINING,
# +304 -> +119 -- the opposite shape of the MoR bolt-on blowup). This matches
# the known recurrent-depth property (Geiping/Huginn): looped models converge
# slower per token but may have a higher ceiling. This run tests exactly that:
# fresh 200M-token run (clean cosine schedule -- NOT a resume of the 100M run,
# whose LR schedule already annealed to min). Does depth-2 cross below 81.20
# given 2x tokens? Byte-identical to screen_rdepth2_30m EXCEPT run_name and
# max_tokens.
run_name: screen_rdepth2_200mtok_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 2          # loop the block stack twice (input-injected each pass)
recurrent_bptt_k: 0         # 0 = full backprop through both passes (fine at R=2)
block_size: 512
batch_size: 16              # eff batch 16*2=32 MATCHES control (fair A/B), while
grad_accum: 2               # halving per-microstep activation offsets R=2's ~2x
                            # memory -> comfortably under the 5080's 16GB.
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 200000000
eval_every: 500
ckpt_every: 1000
keep_last: 1
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
