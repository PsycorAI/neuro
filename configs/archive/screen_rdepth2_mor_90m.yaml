# Scale-up screen for MoR adaptive recurrent-depth (seed0). Base architecture
# from gated_delta_90m_mqar.yaml (gated-delta + decay_gate + MQAR-aug); adds
# recurrent_depth=2 + router on top, per Stage 2. 90M sits between the 30M
# screens and the 350M bet, and closer to MoR's ~135M crossover -> more
# informative than 30M.
#
# THROUGHPUT-OPTIMIZED 2026-07-09 (5080, quality-preserving changes only):
#   - fpt_K 20 -> 10: 10 is the proven value at 350M/500M scale; with the
#     depth-2 loop, K=20 was ~2x the activation footprint for no quality gain.
#     Biggest lever (VRAM + speed), quality-neutral (matches flagship runs).
#   - use_fla_kernel: true: the 1.6x Triton chunked delta-kernel, numerics-
#     preserving. Was missing here; present in every proven larger run.
#   - fused_ce: true: fused cross-entropy, lower memory + faster.
# batch 32 x accum 1 kept (single big microbatch = throughput-optimal; effective
# batch 32 is the screen-family standard, a quality/optimization constant).
# block 512 kept (screen-family standard; raising it would cost throughput).
# compile stays false (router top-k shapes hang dynamo, confirmed 2026-07-07).
run_name: screen_rdepth2_mor_90m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 2048
d_mem: 1024
n_layers: 4
recurrent: true
rec_density: 0.02
set_zeta: 0.3
set_every: 200
recurrent_depth: 2
recurrent_bptt_k: 0
recurrent_router_enabled: true
recurrent_router_threshold: 0.5
recurrent_router_aux_weight: 0.1
block_size: 512
batch_size: 32
grad_accum: 1
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: true
fused_ce: true
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 400000000
eval_every: 2000
ckpt_every: 4000
keep_last: 2
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
