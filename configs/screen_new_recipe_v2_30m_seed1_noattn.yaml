# 30M new-recipe screen v2 (2026-07-31) — CONTROL (no KD).
#
# v2 vs v1: switches from the "fresh 32k BPE" tokenizer to the "top-32k
# most-frequent Llama-3 tokens" subset vocab. Same shape/recipe otherwise.
# The subset approach:
#   - Restores KD compatibility (teacher and student share vocab index space)
#   - Reduces drops from ~10% (old 16k) to ~2-3% (top-32k covers "nephew",
#     "ATP", "mitochondria" etc.)
#   - Uses the original train.bin (raw Llama-3 128k IDs); StreamText's
#     auto-LUT-build path handles the top-32k selection on first launch
#     (no data/vocab_map_32768.npy present → auto-builds it).
#
# Purpose of v2: pair with screen_new_recipe_v2_30m_kd.yaml as an A/B to
# measure the KD quality-per-token lift. This is the CONTROL side.
#
# ATTENTION-ABLATION DIAGNOSTIC (2026-08-01): the clean seed1 re-run
# (screen_new_recipe_v2_30m_ctrl_seed1_clean.yaml, same 5090/batch=32 as
# seed0) CONFIRMED a real, large seed1 divergence (val_ppl gap widening
# 37%->72%->89% over the run vs seed0's control) -- not a GPU/batch
# artifact. Beta telemetry was healthy in BOTH seeds (mu 0.52-0.57, 0%
# dead/at_floor) -- rules out beta-collapse. This run tests whether the
# NEW hybrid attention layer's random init is the source: byte-identical
# to the clean seed1 config except attention_layer_positions: [2] -> null
# (falls back to pure spiking, matching the pre-redesign architecture,
# but keeps the new 32k vocab + relaxed sparsity). If this seed1 run
# converges healthily (similar to seed0's control), attention init is
# implicated. If it ALSO diverges, attention is ruled out.
#
# CAVEAT: runs on the 5080 (batch_size 32->16/grad_accum 1->2 for VRAM),
# NOT the 5090 -- reintroduces the GPU/batch confound the seed1_clean run
# specifically ruled out for the MAIN finding. Treat this as an
# exploratory signal, not a confirmatory result; if it looks informative,
# a same-GPU confirm is warranted before trusting it fully.
run_name: screen_new_recipe_v2_30m_seed1_noattn

# Points at the raw Llama-3-tokenized corpus (not the fresh-BPE bin).
# StreamText auto-builds vocab_map_32768.npy on first launch.
data_bin: /home/glenn/projects/bdh/data/tokenized/train.bin

arch: spiking
vocab: 32768
d: 384
n_neurons: 384
d_mem: 384
n_layers: 4
attention_layer_positions: null
attention_heads: 8
attention_max_seq_len: 4096
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1
mqar_aug: true
mqar_N_min: 16
mqar_N_max: 16
mqar_weight: 0.5
sparsity_lambda: 0.3
sparsity_target: 0.15
gdn2_enabled: true
gdn2_chunked: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001
optimizer: muon
normuon: true
normuon_beta2: 0.95
muon_lr: 0.005
normuon_eps: 1.0e-8
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.0006
lam: 0.98
max_tokens: 30000000
eval_every: 500
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
seed: 1

# KD: OFF (this is the control)
kd_enabled: false
