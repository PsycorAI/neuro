# Recurrent-depth fallback: FIXED depth-3 (no router). Prepped in case Stage 1
# (screen_rdepth2_30m) passes criterion (b) [bounded ablation-Δ] but fails (a)
# [no quality gain over control 81.20] -- per the HANDOFF_2026_07_05_v2.md
# decision tree, tests whether more fixed depth alone helps before adding
# routing complexity. Cheap to run since it's a 1-line diff from Stage 1.
#
# Byte-identical to screen_rdepth2_30m EXCEPT recurrent_depth: 3. VRAM check:
# Stage 1 (depth=2) used only 0.9/8.9GB at batch=16/grad_accum=2 (huge
# headroom on the 5080's 16GB) -- depth=3's extra pass should still be
# comfortably safe at the same batch/accum, so left unchanged for a fair,
# minimal-diff comparison.
run_name: screen_rdepth3_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 3
recurrent_bptt_k: 0
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 20
delta_rule: true
decay_gate: true
mqar_aug: true
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.5
sparsity_lambda: 0.5
sparsity_target: 0.05
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 1000
ckpt_every: 2000
keep_last: 1
log_every: 50
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
