# LoRA SFT r=16 capacity screen -- companion to sft_30m_lora_v2.yaml (r=8)
# and sft_30m_lora_r32_v2.yaml. Answers: does raising LoRA rank close the
# ~1.5 loss gap vs full-FT observed at r=8 (LoRA final 4.25, full-FT 2.68)?
#
# alpha scales with r (2r pattern) so the effective LoRA scaling (alpha/r)
# stays constant across the rank sweep -- this isolates capacity, NOT
# effective learning rate, as the varied factor.
#
# Everything else identical to sft_30m_lora_v2 (same base, same tokens, same
# LR, same targets). 3-point sweep: r=8/16/32.
run_name: sft_30m_lora_r16_v2
sft_init: screen_compile_blk640_30m
sft_dataset: yahma/alpaca-cleaned
sft_split: train
sft_max_len: 512

# --- LoRA: r=16, alpha=32 (alpha/r=2, matches r=8/alpha=16 scaling) ---
lora_enabled: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_targets: [W_q, W_k, W_v]

# --- ARCH: byte-identical to sft_30m_lora_v2 ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0025
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true

lr: 0.0003
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

max_tokens: 100000000
eval_every: 2000
ckpt_every: 2000
keep_last: 2
log_every: 100
amp: true
compile: true
seed: 0
