# Engram v2 A/B -- CONTROL arm. No Engram (v1 or v2).
# Byte-identical to screen_engram_v2_ab_v2_30m.yaml except engram_v2_enabled:false.
#
# Recipe choices vs the existing 30M MoR screen:
#   - recurrent_router / recurrent_depth OFF: isolate the v2 variable, don't
#     confound with MoR (each is testable separately).
#   - mqar_aug OFF: MQAR tests in-context k->v recall (working memory);
#     Engram is a static long-term factual store, orthogonal. Mixing MQAR
#     into the natural-text stream dilutes what v2 has to learn from.
#   - delta_rule + decay_gate ON: our standard baseline recipe (working
#     memory), unchanged from the MoR screen, so v2's factual contribution
#     is measured on top of a modern base, not a strawman.
#
# Evaluate with scripts/engram_factual_eval.py --run <this run>.
run_name: screen_engram_v2_ab_control_30m
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 512
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: true
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1   # β-collapse fix (2026-07-10) -- prevents scalar-β saturation to zero; ~40x memory-Δ improvement over unfixed baseline. Do NOT remove; all screens/A-Bs since this date bake it in as the recipe default.
mqar_aug: false
sparsity_lambda: 0.5
sparsity_target: 0.05
engram_v2_enabled: false
optimizer: muon
muon_lr: 0.005
lr: 0.0006
lam: 0.98
max_tokens: 100000000
eval_every: 2000
ckpt_every: 4000
keep_last: 2
log_every: 100
amp: true
compile: false
compile_mode: default
compile_dynamic: true
seed: 0
