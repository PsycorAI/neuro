# SimPO smoke v3b -- validates the CORRECTED hyperparameters (beta=0.4,
# gamma=0.15) before committing 5090 time to the 500M relaunch.
#
# The original 30M smoke (simpo_30m_smoke.yaml, beta=2.0/gamma=0.5) only ran
# 5M tokens (~150 steps) -- nowhere near enough to reach the collapse zone
# the 500M run hit at ~184M/500M tokens (37% through budget). This smoke runs
# longer (~20M tok, ~490 steps) to actually exercise the corrected settings
# past where a fragile config would start showing trouble, AND exercises the
# new gen_check_every telemetry (added 2026-07-26) so we can eyeball real
# generated text at 5 points through the run, not just loss/acc numbers.
run_name: simpo_30m_smoke_v3b
dpo_init: /home/glenn/projects/neuro/models/checkpoints/sft_30m_full_v2/step_0006104.pt
dpo_dataset: HuggingFaceH4/ultrafeedback_binarized
dpo_split: train_prefs
dpo_max_len: 512

# --- SimPO (corrected) ---
simpo_enabled: true
simpo_beta: 0.4
simpo_gamma: 0.15

# --- Generation sanity-check (NEW) ---
gen_check_every: 100
gen_check_prompt: "The capital of France is"

lora_enabled: false

# --- ARCH: byte-identical to sft_30m_full_v2 ---
arch: spiking
vocab: 16384
d: 1024
n_neurons: 1024
d_mem: 1024
n_layers: 2
recurrent: false
recurrent_depth: 1
recurrent_bptt_k: 0
recurrent_router_enabled: false
block_size: 640
batch_size: 16
grad_accum: 2
eval_batch: 8
use_fpt: true
fpt_K: 10
use_fla_kernel: false
fused_ce: true
delta_rule: true
decay_gate: true
beta_floor: 0.1

mqar_aug: false
mqar_N_min: 4
mqar_N_max: 32
mqar_weight: 0.0
sparsity_lambda: 0.0
sparsity_target: 0.05
curriculum_enabled: false
curriculum_frac: 0.1
curriculum_block_tokens: 4096

gdn2_enabled: true
osdn_enabled: false
engram_v2_enabled: true
engram_v2_K: 8192
engram_v2_heads: 4
engram_v2_orders: [2, 3]
engram_v2_rank: 64
mtp_enabled: true
mtp_offset: 2
mtp_weight: 0.3
mtp_depth: 2
use_rmsnorm: true
embed_scale: true
z_loss_weight: 0.0001

optimizer: muon
normuon: true
normuon_beta2: 0.95
normuon_eps: 1.0e-8
muon_lr: 0.0005
muon_fix_gate_matrices: true
muon_route_embeddings_by_type: true
lr: 0.00005
lr_min_frac: 0.1
lr_warmup_frac: 0.05
lam: 0.98

# ~20M tok (~490 steps at 40960 tok/step) -- past the original 5M smoke,
# proportionally closer to (though still short of) the 500M run's collapse
# zone, enough to see whether the corrected beta/gamma stays well-behaved.
max_tokens: 20000000
ckpt_every: 500
keep_last: 2
log_every: 50
amp: true
compile: true
seed: 0
